<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Campaigns — Setu CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <nav class="topnav" id="topnav"></nav>
  <div class="wrap">
    <div class="page-head">
      <div class="page-head-text">
        <h1 class="page-title">Campaigns</h1>
        <p class="page-sub">Manage your lead generation campaigns and connected Meta webhooks.</p>
      </div>
      <div class="page-head-actions" id="headActions" style="display:none">
        <button class="btn" type="button" id="ctaCreate">Create campaign</button>
      </div>
    </div>

    <div id="banner"></div>

    <div class="card" id="createCard" style="display:none">
      <h2 class="section-title" style="margin-top:0">New campaign</h2>
      <form id="createForm">
        <div class="grid-2">
          <div>
            <label for="name">Name</label>
            <input id="name" required placeholder="e.g. Diwali Offer" />
          </div>
          <div>
            <label for="platform">Platform</label>
            <select id="platform">
              <option value="facebook">Facebook</option>
              <option value="instagram">Instagram</option>
              <option value="both">Both</option>
            </select>
          </div>
        </div>
        <button class="btn" type="submit" style="margin-top:14px">Create campaign</button>
      </form>
    </div>

    <h2 class="section-title">All campaigns</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Platform</th><th>Status</th><th>Webhook</th><th>Created</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

<script src="/assets/app.js"></script>
<script>
  let me;

  function fmt(iso){ return iso ? new Date(iso).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"}) : "—"; }

  async function load() {
    me = await App.requireAuth();
    if (!me) return;
    App.renderNav(me, "/campaigns.html");

    if (App.hasPermission(me, "campaigns.manage")) {
      document.getElementById("createCard").style.display = "block";
      document.getElementById("headActions").style.display = "flex";
    }

    const rows = document.getElementById("rows");
    let campaigns;
    try {
      ({ campaigns } = await App.apiJson("/api/campaigns"));
    } catch (err) {
      rows.innerHTML = `<tr><td colspan="5">
        <div class="state-block">
          <p class="state-title">Unable to load campaigns</p>
          <p class="state-desc">We couldn't retrieve your campaigns. Please try again.</p>
          <div class="state-actions"><button class="btn secondary" id="retryBtn" type="button">Try again</button></div>
        </div>
      </td></tr>`;
      document.getElementById("retryBtn")?.addEventListener("click", load);
      return;
    }

    if (!campaigns.length) {
      rows.innerHTML = `<tr><td colspan="5">
        <div class="state-block">
          <p class="state-title">No campaigns yet</p>
          <p class="state-desc">${App.hasPermission(me, "campaigns.manage") ? "Create your first campaign to start receiving leads." : "Ask an admin to create your first campaign."}</p>
        </div>
      </td></tr>`;
      return;
    }
    rows.innerHTML = campaigns.map(c => `
      <tr onclick="window.location.href='/campaign.html?id=${c.id}'" style="cursor:pointer">
        <td><strong>${App.escapeHtml(c.name)}</strong></td>
        <td>${App.escapeHtml(c.platform)}</td>
        <td><span class="pill ${c.status}">${c.status}</span></td>
        <td><a href="/campaign.html?id=${c.id}">Configure →</a></td>
        <td>${fmt(c.createdAt)}</td>
      </tr>
    `).join("");
  }

  document.getElementById("createForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const banner = document.getElementById("banner");
    banner.innerHTML = "";
    try {
      const { campaign } = await App.apiJson("/api/campaigns", {
        method: "POST",
        body: { name: document.getElementById("name").value.trim(), platform: document.getElementById("platform").value },
      });
      window.location.href = `/campaign.html?id=${campaign.id}`;
    } catch (err) {
      banner.innerHTML = `<div class="banner error">${App.escapeHtml(err.message)}</div>`;
    }
  });

  document.getElementById("ctaCreate").addEventListener("click", () => {
    document.getElementById("createCard").scrollIntoView({ behavior: "smooth", block: "start" });
    document.getElementById("name").focus();
  });

  load();
</script>
</body>
</html>
