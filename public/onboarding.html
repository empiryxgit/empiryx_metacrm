<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Set up your workspace — RUTA Lead Management System</title>
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card wizard-card" id="wizardCard">
      <div id="loadingState" style="text-align:center; padding:20px 0; color:var(--text-muted); font-size:13px">Loading your setup…</div>
    </div>
  </div>

<script src="/assets/app.js"></script>
<script>
// ---------------------------------------------------------------------------
// First-time setup - INDIVIDUAL USERS ONLY (an agency or agency-onboarded-
// client company's onboarding is always already COMPLETED by the time it
// could ever reach this page - see src/domain/onboarding.ts's own header
// comment - so the only way here is either a fresh Individual signup, or a
// direct visit while setup is still in progress).
//
// Deliberately a fully SILENT flow now (2026-09-18): this used to open on a
// "Welcome to RUTA" screen asking for Business Name + Mobile Number, but
// register.html's own step-2 form already collects both of those (required
// for every account type - see that file's own comment on its `mobile`
// field) - asking again here was just re-collecting the same two details a
// second time. The BUSINESS_PROFILE step itself still exists server-side
// (src/domain/onboarding.ts's ONBOARDING_STEPS, saveBusinessProfile in
// onboardingWizard.ts - left untouched, together with every one of its
// passing tests, so this is a pure front-end change) and is still submitted
// - just with an empty body (see beginSetup() below) instead of a form,
// exactly the same "silently walk it forward with safe defaults" treatment
// CRM Basics/Pipeline/Lead Source/Meta Connection already got in the
// original simplification pass. The first thing a fresh signup now actually
// sees on this page is the "Setting up your account…" spinner, then
// straight to the Connect RUTA / Setup Complete screen - never a form.
// Facebook/Instagram connection is decided from the Dashboard's own setup
// checklist instead (see dashboard.html's renderSetupChecklist), same as
// before this change.
//
// This page is still state-driven off GET /api/onboarding/wizard/status
// (src/application/onboardingWizard.ts's getOnboardingContext) - a save
// failure mid-chain can never corrupt or lose anything, it just resumes
// silently from wherever the server says next.
// ---------------------------------------------------------------------------

const card = document.getElementById("wizardCard");
let ctx = null; // last-known OnboardingContext from the server

// RUTA AI Assistant platform number (see src/application/metaSync/
// rutaAiAssistant.ts's header, and metaWhatsappEventService.ts's
// isRutaPlatformNumber) - the ONE WhatsApp number RUTA itself owns, shared
// by every tenant, for Assistant chat + the onboarding welcome message.
// RUTA can't message a brand-new user first (WhatsApp rejects a free-form
// send outside the 24h customer-service window, and a user who's never
// messaged in is always outside it - see sendOnboardingWelcomeMessage's own
// comment) - so onboarding's last screen asks the user to send the first
// message instead, which is what actually delivers the welcome text (see
// handleOneMessagePipeline's deferred-welcome-on-first-inbound-message
// logic). Keep this number in sync with RUTA_PLATFORM_WHATSAPP_PHONE_NUMBER_ID
// (.env.example) - there's no live endpoint wiring this HTML to that env var,
// so a number change on one side must be updated on the other by hand.
const RUTA_WHATSAPP_DISPLAY = "+91 97272 11848";
const RUTA_WHATSAPP_WA_LINK = "https://wa.me/919727211848?text=" + encodeURIComponent("Hi");

function esc(s) {
  return App.escapeHtml(s);
}

function wizardShell(innerHtml) {
  card.innerHTML = innerHtml;
}

// ---------------------------------------------------------------------------
// Business Profile - silent (see this file's own header comment for why).
// ---------------------------------------------------------------------------

/** Submits the BUSINESS_PROFILE step with nothing new to say - name/phone
 * were already collected at registration - purely to advance the server's
 * stored step pointer, then hands straight off to finishRemainingSteps()
 * for the rest of the (also silent) chain. No form, no button click: this
 * runs the moment render() sees NOT_STARTED or a stored step of
 * BUSINESS_PROFILE. */
async function beginSetup() {
  showFinishing("Setting up your account…");
  try {
    ctx = await App.apiJson("/api/onboarding/wizard/business-profile", { method: "POST", body: {} });
    finishRemainingSteps(ctx.step);
  } catch (err) {
    showFinishingError(err.message || "We couldn't set up your account - please try again.", beginSetup);
  }
}

/** Final screen - shown once account setup itself is done (REVIEW's own
 * completeWizard() already succeeded), before landing on the Dashboard.
 * Purely instructional, not a gate: "I'll do this later" still goes
 * straight to the Dashboard, and RUTA's own deferred-welcome logic re-checks
 * on every future inbound message regardless of whether the user connects
 * from here, later from the Dashboard's setup checklist, or never sees this
 * screen at all (e.g. a page reload lands back on the Dashboard directly
 * via render()'s COMPLETED branch above). */
function renderConnectRuta() {
  wizardShell(`
    <h1>You're all set! 🎉</h1>
    <p class="sub">One last step - connect your RUTA AI Assistant on WhatsApp so it can answer questions about your leads and send you updates, right from your phone.</p>
    <div class="hint" style="font-size:14px; margin:14px 0 20px">
      Send <strong>Hi</strong> to <strong>${esc(RUTA_WHATSAPP_DISPLAY)}</strong> on WhatsApp to connect.
    </div>
    <div class="wizard-actions" style="flex-direction:column">
      <button class="btn full" type="button" id="waBtn">Message RUTA on WhatsApp</button>
      <button class="btn secondary full" type="button" id="skipConnectBtn">I'll do this later - go to Dashboard</button>
    </div>
  `);
  document.getElementById("waBtn").addEventListener("click", () => {
    window.open(RUTA_WHATSAPP_WA_LINK, "_blank", "noopener");
  });
  document.getElementById("skipConnectBtn").addEventListener("click", () => {
    window.location.href = "/dashboard.html";
  });
}

function showFinishing(message) {
  wizardShell(`<div style="text-align:center; padding:30px 0; color:var(--text-muted); font-size:13px">${esc(message)}</div>`);
}

function showFinishingError(message, retry) {
  wizardShell(`
    <div class="banner error">${esc(message)}</div>
    <div class="wizard-actions">
      <button class="btn full" id="retryBtn">Try Again</button>
    </div>
  `);
  document.getElementById("retryBtn").addEventListener("click", retry);
}

/** Silently walks the company through every step this simplified flow no
 * longer shows the user - CRM Basics (defaults to "Lead"), Pipeline (the
 * recommended one), Lead Source and Meta Connection (both skipped, since
 * neither is asked here anymore), then Review's own completeWizard() - and
 * lands on the Dashboard. `fromStep` is wherever the company's stored resume
 * pointer already is (normally CRM_BASICS, right after Business Profile was
 * just submitted; only ever something later than that if a previous visit
 * was interrupted partway through this exact chain). Each call re-derives
 * the next step from what the server actually returns, never assumes it, so
 * an interruption anywhere just resumes cleanly on the next visit. */
async function finishRemainingSteps(fromStep) {
  showFinishing("Setting up your account…");
  try {
    let step = fromStep;
    if (step === "CRM_BASICS") {
      ctx = await App.apiJson("/api/onboarding/wizard/crm-basics", { method: "POST", body: {} });
      step = ctx.step;
    }
    if (step === "PIPELINE") {
      ctx = await App.apiJson("/api/onboarding/wizard/pipeline", { method: "POST", body: { choice: "recommended" } });
      step = ctx.step;
    }
    if (step === "LEAD_SOURCE") {
      ctx = await App.apiJson("/api/onboarding/wizard/skip", { method: "POST", body: { step: "LEAD_SOURCE" } });
      step = ctx.step;
    }
    if (step === "META_CONNECTION") {
      ctx = await App.apiJson("/api/onboarding/wizard/skip", { method: "POST", body: { step: "META_CONNECTION" } });
      step = ctx.step;
    }
    if (step === "REVIEW") {
      ctx = await App.apiJson("/api/onboarding/wizard/complete", { method: "POST", body: {} });
    }
    renderConnectRuta();
  } catch (err) {
    showFinishingError(err.message || "We couldn't finish setting up your account - please try again.", () => finishRemainingSteps(ctx.step));
  }
}

function render() {
  if (!ctx) return;
  if (ctx.status === "COMPLETED") {
    window.location.href = "/dashboard.html";
    return;
  }
  if (ctx.status === "NOT_STARTED" || ctx.step === "BUSINESS_PROFILE") {
    beginSetup();
    return;
  }
  // Business Profile is already submitted - nothing left to ask, just
  // finish the rest with defaults, same as beginSetup() does after it.
  finishRemainingSteps(ctx.step);
}

(async () => {
  const me = await App.requireAuth({ allowIncompleteOnboarding: true });
  if (!me) return;
  try {
    ctx = await App.apiJson("/api/onboarding/wizard/status");
    render();
  } catch (err) {
    card.innerHTML = `<div class="banner error">${esc(err.message || "Couldn't load your setup - please refresh.")}</div>`;
  }
})();
</script>
</body>
</html>
