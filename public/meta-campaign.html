<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meta campaign — RUTA Lead Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <nav class="topnav" id="topnav"></nav>
  <div class="wrap">
    <p style="margin:0 0 10px"><a href="/campaigns.html" style="font-size:12.5px; color:var(--text-muted)">← Back to campaigns</a></p>
    <h1 class="page-title" id="metaCampaignName">Loading…</h1>
    <p class="page-sub" id="metaCampaignSub"></p>
    <div id="banner"></div>

    <!-- =====================================================================
         One-Meta-table-source-of-truth fix (2026-09) - this screen used to
         be THE mapping UI, letting a person pick which CRM campaign a Meta
         campaign should be attributed to. That picker is gone: there's no
         longer any CRM campaign for a person to see, name, or choose. This
         screen's ONE job now is just the Activate/Deactivate toggle - a
         Meta campaign is an external Meta object (see
         src/infrastructure/db/schema.ts's metaCampaigns doc comment) that
         exists independently of any CRM campaign, and Activate silently
         auto-creates/reuses one hidden CRM campaign row behind the scenes
         so the rest of the app (dashboard/Pipeline/the AI assistant/agency
         reporting) keeps working exactly as before - see
         api/campaigns/handler.ts's handleMapMetaCampaign for exactly what
         that does. Gated by the plan's remaining campaign-slot count, same
         as always. "Deactivate" (.../unmap) pauses the mapped CRM campaign
         rather than severing the link, which frees its slot for another
         campaign and stops new leads while keeping every lead already
         captured exactly as it is.
         ===================================================================== -->
    <h2 class="section-title">Activate for lead capture</h2>
    <div class="card">
      <div id="mappingStateDesc" class="hint" style="margin:0 0 8px"></div>
      <div id="limitHint" class="hint" style="margin:0 0 14px"></div>
      <div class="hint" style="margin:0 0 14px">Leads from this Meta campaign are only captured while it's Activated. Deactivating keeps every lead already captured but stops new ones until you Activate it again.</div>
      <div style="display:flex; gap:10px">
        <button class="btn" type="button" id="activateBtn" style="display:none">Activate</button>
        <button class="btn secondary" type="button" id="unmapBtn" style="display:none">Deactivate</button>
      </div>
    </div>
  </div>

<script src="/assets/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const metaCampaignId = params.get("id");
  let me;
  let metaCampaign;

  function statusLabel(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  // One-Meta-table-source-of-truth fix: duplicated from campaigns.html's
  // own small self-contained helper (this page has no shared JS module to
  // put it in) - see that copy's comment for why platform can be null.
  function platformLabel(p){
    if (p === "facebook") return "Facebook";
    if (p === "instagram") return "Instagram";
    if (p === "both") return "Facebook + Instagram";
    return "—";
  }

  async function load() {
    me = await App.requireAuth();
    if (!me) return;
    App.renderNav(me, "/campaigns.html");

    if (!metaCampaignId) {
      document.getElementById("metaCampaignName").textContent = "No Meta campaign selected";
      return;
    }

    let campaignLimit;
    try {
      ({ metaCampaign, campaignLimit } = await App.apiJson(`/api/campaigns/meta/${metaCampaignId}`));
    } catch (err) {
      document.getElementById("metaCampaignName").textContent = "Meta campaign not found";
      document.getElementById("metaCampaignSub").textContent = "";
      return;
    }

    document.getElementById("metaCampaignName").textContent = metaCampaign.name;
    document.getElementById("metaCampaignSub").innerHTML =
      `<span class="pill ${metaCampaign.status}">${statusLabel(metaCampaign.status)}</span> · ${platformLabel(metaCampaign.platform)} · ${metaCampaign.leadsCount} lead${metaCampaign.leadsCount === 1 ? "" : "s"} · <span class="pill system">Synced from Meta</span>`;

    const canManageCampaign = App.hasPermission(me, "campaigns.manage");
    const desc = document.getElementById("mappingStateDesc");
    const limitHint = document.getElementById("limitHint");

    // Campaign-limit fix / one-Meta-table-source-of-truth fix: "active"
    // here means mapped AND the mapped (hidden) CRM campaign isn't itself
    // paused/archived - see api/campaigns/handler.ts's own comment on what
    // Activate/Deactivate do at the campaign-row level. Mapped-but-paused
    // reads as "Deactivated," never as if it were still mapped-and-live.
    const isActive = !!metaCampaign.crmCampaignId && metaCampaign.crmCampaignStatus !== "paused" && metaCampaign.crmCampaignStatus !== "archived";
    if (isActive) {
      desc.innerHTML = `<span class="pill active">Active</span> · new leads are being captured.`;
    } else if (metaCampaign.crmCampaignId) {
      desc.innerHTML = `<span class="pill paused">Deactivated</span> · leads already captured are kept, but no new ones will be. Click Activate to resume.`;
    } else {
      desc.textContent = "Not activated yet - this Meta campaign's leads are not being captured until you Activate it below.";
    }

    if (campaignLimit) {
      limitHint.textContent = `${campaignLimit.used} of ${campaignLimit.limit} campaign slot${campaignLimit.limit === 1 ? "" : "s"} used on your plan.`;
    }

    if (!canManageCampaign) return;

    if (isActive) {
      document.getElementById("unmapBtn").style.display = "inline-flex";
    } else {
      document.getElementById("activateBtn").style.display = "inline-flex";
    }
  }

  document.getElementById("activateBtn").addEventListener("click", async () => {
    const banner = document.getElementById("banner");
    banner.innerHTML = "";
    const btn = document.getElementById("activateBtn");
    btn.disabled = true;
    try {
      await App.apiJson(`/api/campaigns/meta/${metaCampaignId}/map`, { method: "POST" });
      banner.innerHTML = `<div class="banner success">Campaign activated - new leads will be captured.</div>`;
      await load();
    } catch (err) {
      // 402 = plan's campaign limit reached (see assertCampaignLimitNotReached
      // in src/application/billing.ts, applied here by handleMapMetaCampaign
      // whenever Activate is about to occupy a new plan slot - either a
      // brand-new hidden campaign or reactivating a previously Deactivated
      // one) - hard block, redirect straight to the subscription page.
      if (err.status === 402) {
        window.location.href = "/subscription.html";
        return;
      }
      banner.innerHTML = `<div class="banner error">${App.escapeHtml(err.message)}</div>`;
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById("unmapBtn").addEventListener("click", async () => {
    const banner = document.getElementById("banner");
    banner.innerHTML = "";
    const btn = document.getElementById("unmapBtn");
    btn.disabled = true;
    try {
      await App.apiJson(`/api/campaigns/meta/${metaCampaignId}/unmap`, { method: "POST" });
      banner.innerHTML = `<div class="banner success">Campaign deactivated - leads already captured are kept; no new ones will be until you Activate it again.</div>`;
      await load();
    } catch (err) {
      banner.innerHTML = `<div class="banner error">${App.escapeHtml(err.message)}</div>`;
    } finally {
      btn.disabled = false;
    }
  });

  load();
</script>
</body>
</html>
