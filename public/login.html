<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Meta Lead Ads</title>
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Sign in</h1>
      <p class="sub">Meta Lead Ads → CRM integration</p>
      <div id="banner"></div>
      <form id="form">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" />

        <button class="btn full" type="submit" id="submitBtn">Sign in</button>
      </form>
      <div class="switch">New here? <a href="/register.html">Create a company account</a></div>
    </div>
  </div>

<script src="/assets/app.js"></script>
<script>
  const form = document.getElementById("form");
  const banner = document.getElementById("banner");
  const submitBtn = document.getElementById("submitBtn");
  const params = new URLSearchParams(window.location.search);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    banner.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in…";
    try {
      const result = await App.apiJson("/api/auth/login", {
        method: "POST",
        body: {
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        },
      });
      if (result.user.mustChangePassword) {
        window.location.href = "/change-password.html";
        return;
      }
      window.location.href = params.get("next") || "/dashboard.html";
    } catch (err) {
      banner.innerHTML = `<div class="banner error">${App.escapeHtml(err.message)}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign in";
    }
  });
</script>
</body>
</html>
