<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Form Builder — RUTA Lead Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <nav class="topnav" id="topnav"></nav>
  <div class="wrap" style="max-width:1320px">
    <div class="page-head">
      <div class="page-head-text">
        <h1 class="page-title" id="formTitle">Form Builder</h1>
        <p class="page-sub" id="formSub">Loading…</p>
      </div>
      <div class="page-head-actions" id="headActions" style="display:none">
        <button class="btn secondary" type="button" id="previewBtn">Preview</button>
        <button class="btn secondary" type="button" id="saveBtn">Save draft</button>
        <button class="btn" type="button" id="publishBtn">Publish</button>
        <button class="btn secondary" type="button" id="setDefaultBtn" style="display:none">Set as default</button>
        <button class="btn secondary" type="button" id="resetDefaultBtn" style="display:none">Reset to original</button>
        <button class="btn secondary" type="button" id="archiveBtn" style="display:none">Archive</button>
      </div>
    </div>

    <div id="banner"></div>
    <div id="modalRoot"></div>

    <div class="card" id="metaCard" style="margin-bottom:var(--space-5)">
      <div class="grid-2">
        <div>
          <label for="metaName">Form name</label>
          <input id="metaName" />
        </div>
        <div>
          <label for="metaDescription">Description</label>
          <input id="metaDescription" placeholder="Internal note — shown to your team only" />
        </div>
      </div>
    </div>

    <div class="card" id="formSettingsCard" style="margin-bottom:var(--space-5)">
      <h2 class="section-title" style="margin-top:0">Form settings</h2>
      <p class="hint" style="margin-top:-6px; margin-bottom:14px">Every lead this form creates is tagged with these — independent of which fields the form actually asks the filler to fill in.</p>
      <div id="formSettingsBody"></div>
    </div>

    <div class="builder-shell">
      <div class="builder-col builder-col-palette">
        <div class="builder-col-title">Field types</div>
        <div id="paletteFieldTypes"></div>
        <div class="builder-col-title" style="margin-top:18px">CRM fields</div>
        <div id="paletteCrmFields"></div>
        <p class="hint" style="margin-top:14px">Click to add, or drag onto the form.</p>
      </div>

      <div class="builder-col builder-col-canvas">
        <div class="builder-col-title">Form preview</div>
        <div id="builderCanvas" class="builder-canvas"></div>
      </div>

      <div class="builder-col builder-col-settings">
        <div class="builder-col-title">Field settings</div>
        <div id="settingsPanel"></div>
      </div>
    </div>
  </div>

<script src="/assets/app.js"></script>
<script src="/assets/formRenderer.js"></script>
<script>
  let me, canManage;
  let formId = new URLSearchParams(window.location.search).get("id");
  let form = null;
  let fields = []; // working copy: {key,label,fieldType,mappingType,systemField,options,placeholder,helpText,defaultValue,required,conditional}
  let selectedKey = null;
  let owners = [], stages = [], sources = [], campaigns = [];
  // Full { key, name, pipelineName, stages, fields } object from
  // /api/pipeline's own industry-template lookup - the SAME data
  // getIndustryTemplate() in src/domain/industryTemplates.ts derives
  // company.industryTemplate into. Reading name/pipelineName from here
  // (rather than a hardcoded per-industry map) means a newly added industry
  // template shows correctly with zero Form Builder changes.
  let template = null;
  let myBranches = null; // { scope, branches: [{id,name,code,isPrimary}] } from /api/branches/mine - scoped to what THIS user is permitted to manage
  // Working copy of Form Settings (Branch Configuration + CRM defaults) -
  // mirrors `fields` above: mutated locally by the panel below, sent
  // alongside name/description/fields in the same PUT on Save/Publish (see
  // saveBtn/publishBtn), so there is exactly one save flow for a form's
  // meta, settings and fields together, not a separate save button per
  // section.
  let formSettings = {
    branchMode: "all", branchId: null, branchFieldKey: null, branchFieldMap: {},
    defaultPipelineStage: null, defaultCrmCampaignId: null, defaultSource: null, defaultOwnerId: null,
  };
  let dragState = null;

  const FIELD_TYPE_PALETTE = [
    { fieldType: "text", label: "Text" },
    { fieldType: "textarea", label: "Long Text" },
    { fieldType: "number", label: "Number" },
    { fieldType: "currency", label: "Currency" },
    { fieldType: "email", label: "Email" },
    { fieldType: "phone", label: "Phone" },
    { fieldType: "date", label: "Date" },
    { fieldType: "datetime", label: "Date & Time" },
    { fieldType: "select", label: "Dropdown" },
    { fieldType: "radio", label: "Radio" },
    { fieldType: "checkbox", label: "Checkbox" },
    { fieldType: "multiselect", label: "Multi-select" },
  ];
  const CRM_FIELD_PALETTE = [
    { systemField: "fullName", label: "Customer Name", fieldType: "text" },
    { systemField: "phoneNumber", label: "Phone", fieldType: "phone" },
    { systemField: "email", label: "Email", fieldType: "email" },
    { systemField: "source", label: "Lead Source", fieldType: "select" },
    { systemField: "ownerId", label: "Lead Owner", fieldType: "select" },
    { systemField: "crmCampaignId", label: "Campaign", fieldType: "select" },
    { systemField: "pipelineStage", label: "Pipeline Stage", fieldType: "select" },
    { systemField: "nextFollowUpAt", label: "Next Follow-up", fieldType: "date" },
    { systemField: "notes", label: "Notes", fieldType: "textarea" },
  ];
  const FIELD_TYPE_LABELS = Object.fromEntries(FIELD_TYPE_PALETTE.map(f => [f.fieldType, f.label]));

  // ---- "Reset to original" for the default form --------------------------
  // Mirrors SYSTEM_FIELDS_LEAD / SYSTEM_FIELDS_CRM / REAL_ESTATE_TEMPLATE and
  // SOLAR_TEMPLATE.defaultFormFields in src/domain/industryTemplates.ts -
  // the exact fields (and order) a company's default Add Customer form is
  // provisioned with at onboarding. Keep in sync with that file. Used only
  // to let an admin restore the default form to that pristine state after
  // it's been edited - see resetDefaultBtn below.
  // Industry display name and Pipeline name are read live from the
  // `template` object (see loadSupportingData) rather than a hardcoded
  // per-industry map, so a newly added industry template needs zero Form
  // Builder changes to display correctly.
  const SYSTEM_FIELDS_LEAD_DEFS = [
    { key: "fullName", label: "Customer Name", fieldType: "text", mappingType: "system", systemField: "fullName", required: true },
    { key: "phoneNumber", label: "Phone", fieldType: "phone", mappingType: "system", systemField: "phoneNumber", required: true },
    { key: "email", label: "Email", fieldType: "email", mappingType: "system", systemField: "email" },
  ];
  const SYSTEM_FIELDS_CRM_DEFS = [
    { key: "source", label: "Source", fieldType: "select", mappingType: "system", systemField: "source" },
    { key: "ownerId", label: "Owner", fieldType: "select", mappingType: "system", systemField: "ownerId" },
    { key: "pipelineStage", label: "Pipeline Stage", fieldType: "select", mappingType: "system", systemField: "pipelineStage" },
    { key: "nextFollowUpAt", label: "Next Follow-up", fieldType: "date", mappingType: "system", systemField: "nextFollowUpAt" },
    { key: "notes", label: "Requirement / Notes", fieldType: "textarea", mappingType: "system", systemField: "notes" },
  ];
  const INDUSTRY_DEFAULT_FORM_FIELD_DEFS = {
    real_estate: [
      ...SYSTEM_FIELDS_LEAD_DEFS,
      { key: "property", label: "Property / Project", fieldType: "text", mappingType: "custom" },
      { key: "propertyType", label: "Property Type", fieldType: "select", mappingType: "custom", options: ["Apartment", "Villa", "Plot", "Commercial", "Other"] },
      { key: "budget", label: "Budget", fieldType: "currency", mappingType: "custom" },
      { key: "location", label: "Preferred Location", fieldType: "text", mappingType: "custom" },
      ...SYSTEM_FIELDS_CRM_DEFS,
    ],
    solar: [
      ...SYSTEM_FIELDS_LEAD_DEFS,
      { key: "propertyType", label: "Property Type", fieldType: "select", mappingType: "custom", options: ["Residential", "Commercial"] },
      { key: "monthlyBill", label: "Monthly Electricity Bill", fieldType: "currency", mappingType: "custom" },
      { key: "systemCapacity", label: "Required System Capacity (kW)", fieldType: "number", mappingType: "custom" },
      { key: "location", label: "Location", fieldType: "text", mappingType: "custom" },
      ...SYSTEM_FIELDS_CRM_DEFS,
    ],
  };

  function defaultFormFieldsForIndustry(industryKey){
    const defs = INDUSTRY_DEFAULT_FORM_FIELD_DEFS[industryKey] || INDUSTRY_DEFAULT_FORM_FIELD_DEFS.real_estate;
    return defs.map(def => ({
      key: def.key, label: def.label, fieldType: def.fieldType, mappingType: def.mappingType,
      systemField: def.mappingType === "system" ? def.systemField : null,
      options: def.options || [], placeholder: null, helpText: null, defaultValue: null,
      required: Boolean(def.required), conditional: null,
    }));
  }

  function showBanner(message, kind){
    document.getElementById("banner").innerHTML = `<div class="banner ${kind === "success" ? "success" : "error"}">${App.escapeHtml(message)}</div>`;
  }

  function slugFromLabel(label, existingKeys){
    let base = label.trim().replace(/[^a-zA-Z0-9]+/g, " ").trim().split(/\s+/)
      .map((w, i) => i === 0 ? w.toLowerCase() : (w[0] || "").toUpperCase() + w.slice(1).toLowerCase()).join("");
    if (!base) base = "field";
    if (!/^[a-zA-Z]/.test(base)) base = "f" + base;
    let key = base, n = 1;
    while (existingKeys.includes(key)) { key = base + n; n++; }
    return key;
  }

  function dynamicOptionsMap(){
    return {
      source: sources.map(s => ({ value: s.key, label: s.label })),
      ownerId: owners.map(o => ({ value: o.id, label: o.fullName })),
      pipelineStage: stages.map(s => ({ value: s.key, label: s.label })),
      crmCampaignId: campaigns.map(c => ({ value: c.id, label: c.name })),
    };
  }

  // Same resolution FormRenderer.optionsFor uses at render time: a CRM
  // field's choices always come from the company's live data, a custom
  // field's from its own configured options list.
  function fieldChoices(field){
    if (field.systemField) {
      const dyn = dynamicOptionsMap();
      if (dyn[field.systemField]) return dyn[field.systemField];
    }
    return (field.options || []).map(o => ({ value: o, label: o }));
  }

  // ---- Palette ----------------------------------------------------------

  function paletteItemHtml(def){
    return `<div class="palette-item" draggable="true" data-def='${JSON.stringify(def).replace(/'/g, "&#39;")}'>
      <span class="palette-item-label">${App.escapeHtml(def.label)}</span>
      <span class="palette-item-plus">+</span>
    </div>`;
  }

  function renderPalette(){
    document.getElementById("paletteFieldTypes").innerHTML = FIELD_TYPE_PALETTE.map(paletteItemHtml).join("");
    document.getElementById("paletteCrmFields").innerHTML = CRM_FIELD_PALETTE.map(paletteItemHtml).join("");

    document.querySelectorAll(".palette-item").forEach(el => {
      el.addEventListener("click", () => addField(JSON.parse(el.dataset.def)));
      el.addEventListener("dragstart", (e) => {
        dragState = { kind: "palette", def: JSON.parse(el.dataset.def) };
        e.dataTransfer.effectAllowed = "copy";
      });
    });
  }

  function newFieldFromDef(def, existingKeys){
    const isSystem = Boolean(def.systemField);
    const key = isSystem ? def.systemField : slugFromLabel(def.label, existingKeys);
    return {
      key, label: def.label, fieldType: def.fieldType,
      mappingType: isSystem ? "system" : "custom",
      systemField: isSystem ? def.systemField : null,
      options: ["select", "radio", "multiselect"].includes(def.fieldType) && !isSystem ? ["Option 1", "Option 2"] : [],
      placeholder: null, helpText: null, defaultValue: null, required: false, conditional: null,
    };
  }

  function addField(def){
    const existingKeys = fields.map(f => f.key);
    if (def.systemField && existingKeys.includes(def.systemField)) {
      selectedKey = def.systemField;
      renderAll();
      return;
    }
    const field = newFieldFromDef(def, existingKeys);
    fields.push(field);
    selectedKey = field.key;
    renderAll();
  }

  // ---- Canvas (live preview + reorder) -----------------------------------

  // On the default Add Customer form, every field the company was
  // provisioned with at onboarding - the universal CRM fields *and* the
  // industry's own fields (Real Estate: property/propertyType/budget/
  // location, Solar: propertyType/monthlyBill/systemCapacity/location) -
  // stays exactly as it was created: fixed in place, can't be dragged,
  // reordered or removed. This mirrors SYSTEM_FIELDS_LEAD/SYSTEM_FIELDS_CRM
  // and REAL_ESTATE_TEMPLATE/SOLAR_TEMPLATE.defaultFormFields in
  // src/domain/industryTemplates.ts - keep this list in sync with that file.
  // Only fields an admin adds beyond that provisioned set are freely
  // draggable/removable; admins can still drag new fields in anywhere
  // around/between the locked ones. Non-default forms are never locked.
  const DEFAULT_TEMPLATE_FIELD_KEYS = new Set([
    // universal - every industry's default form (SYSTEM_FIELDS_LEAD / SYSTEM_FIELDS_CRM)
    "fullName", "phoneNumber", "email", "source", "ownerId", "pipelineStage", "nextFollowUpAt", "notes",
    // Real Estate industry fields
    "property", "propertyType", "budget", "location",
    // Solar industry fields ("propertyType" and "location" keys are shared with Real Estate above)
    "monthlyBill", "systemCapacity",
  ]);

  function isFieldLocked(field){
    return Boolean(form && form.isDefault && DEFAULT_TEMPLATE_FIELD_KEYS.has(field.key));
  }

  function fieldRowHtml(field){
    const locked = isFieldLocked(field);
    const bodyHtml = FormRenderer.renderFields([field], {}, { dynamicOptions: dynamicOptionsMap(), disabledFields: fields.map(f => f.key) });
    return `<div class="builder-field-row ${selectedKey === field.key ? "selected" : ""} ${locked ? "locked" : ""}" draggable="${locked ? "false" : "true"}" data-key="${field.key}">
      <div class="builder-field-row-head">
        <span class="drag-handle ${locked ? "locked" : ""}" title="${locked ? "Locked in place on the default form" : "Drag to reorder"}">${locked ? "🔒" : "⋮⋮"}</span>
        <span class="builder-field-type-badge">${App.escapeHtml(FIELD_TYPE_LABELS[field.fieldType] || field.fieldType)}</span>
        ${field.mappingType === "system" ? '<span class="pill system">CRM field</span>' : ""}
        ${field.required ? '<span class="pill failed">Required</span>' : ""}
        ${locked ? '<span class="pill pending">Locked</span>' : ""}
        <span class="builder-field-row-actions">
          <button type="button" class="icon-action" data-dup="${field.key}" title="Duplicate">⧉</button>
          ${locked ? "" : `<button type="button" class="icon-action" data-del="${field.key}" title="Delete">✕</button>`}
        </span>
      </div>
      <div class="builder-field-row-body">${bodyHtml}</div>
    </div>`;
  }

  function renderCanvas(){
    const canvas = document.getElementById("builderCanvas");
    canvas.innerHTML = fields.length
      ? fields.map(fieldRowHtml).join("")
      : `<div class="state-block"><p class="state-title">No fields yet</p><p class="state-desc">Add fields from the palette on the left, or drag one onto this area.</p></div>`;

    canvas.querySelectorAll(".builder-field-row").forEach(row => {
      row.addEventListener("click", (e) => {
        if (e.target.closest("[data-dup],[data-del],input,select,textarea,label")) return;
        selectedKey = row.dataset.key;
        renderAll();
      });
      row.addEventListener("dragstart", (e) => {
        const field = fields.find(f => f.key === row.dataset.key);
        if (field && isFieldLocked(field)) { e.preventDefault(); return; }
        dragState = { kind: "field", key: row.dataset.key };
        e.dataTransfer.effectAllowed = "move";
      });
      row.querySelector("[data-dup]")?.addEventListener("click", () => duplicateField(row.dataset.key));
      row.querySelector("[data-del]")?.addEventListener("click", () => deleteField(row.dataset.key));
    });

    canvas.ondragover = (e) => { e.preventDefault(); canvas.classList.add("dragover"); };
    canvas.ondragleave = () => canvas.classList.remove("dragover");
    canvas.ondrop = (e) => {
      e.preventDefault();
      canvas.classList.remove("dragover");
      if (!dragState) return;
      const rows = Array.from(canvas.querySelectorAll(".builder-field-row"));
      let insertIdx = rows.length;
      for (let i = 0; i < rows.length; i++) {
        const rect = rows[i].getBoundingClientRect();
        if (e.clientY < rect.top + rect.height / 2) { insertIdx = i; break; }
      }
      if (dragState.kind === "palette") {
        const existingKeys = fields.map(f => f.key);
        if (dragState.def.systemField && existingKeys.includes(dragState.def.systemField)) { dragState = null; return; }
        const field = newFieldFromDef(dragState.def, existingKeys);
        fields.splice(insertIdx, 0, field);
        selectedKey = field.key;
      } else if (dragState.kind === "field") {
        const fromIdx = fields.findIndex(f => f.key === dragState.key);
        if (fromIdx === -1) { dragState = null; return; }
        const [moved] = fields.splice(fromIdx, 1);
        let target = insertIdx;
        if (fromIdx < target) target -= 1;
        fields.splice(target, 0, moved);
      }
      dragState = null;
      renderAll();
    };
  }

  function duplicateField(key){
    const idx = fields.findIndex(f => f.key === key);
    if (idx === -1) return;
    const original = fields[idx];
    if (original.mappingType === "system") return; // a CRM field can only appear once
    const existingKeys = fields.map(f => f.key);
    const copy = { ...original, key: slugFromLabel(original.label + " copy", existingKeys), options: [...(original.options || [])] };
    fields.splice(idx + 1, 0, copy);
    selectedKey = copy.key;
    renderAll();
  }

  function deleteField(key){
    const field = fields.find(f => f.key === key);
    if (field && isFieldLocked(field)) return; // built-in CRM fields on the default form can't be removed
    fields = fields.filter(f => f.key !== key);
    if (selectedKey === key) selectedKey = null;
    renderAll();
  }

  // ---- Settings panel -----------------------------------------------

  function optionRowHtml(o, i){
    return `<div class="option-row" data-idx="${i}"><input type="text" class="option-input" value="${App.escapeHtml(o)}" /><button type="button" class="icon-action" data-remove-option="${i}" title="Remove">✕</button></div>`;
  }

  function renderSettings(){
    const panel = document.getElementById("settingsPanel");
    const field = fields.find(f => f.key === selectedKey);
    if (!field) {
      panel.innerHTML = `<p class="hint">Select a field to edit its settings, or add one from the palette.</p>`;
      return;
    }

    if (isFieldLocked(field)) {
      panel.innerHTML = `
        <div class="field-settings">
          <p class="hint">🔒 This field was set up with the default form and stays as-is — label, options and settings can't be changed here. Add new fields from the palette for anything else you need.</p>
          <label>Label</label>
          <input value="${App.escapeHtml(field.label)}" disabled />
          ${field.mappingType === "system"
            ? `<p class="hint">CRM field — maps to <code>${App.escapeHtml(field.systemField)}</code>.</p>`
            : `<label style="margin-top:10px">Field key</label><input value="${App.escapeHtml(field.key)}" disabled />`}
          ${(field.options || []).length ? `<label style="margin-top:10px">Options</label><p class="hint">${field.options.map(App.escapeHtml).join(", ")}</p>` : ""}
          <label class="checkbox-option" style="margin-top:10px"><input type="checkbox" disabled ${field.required ? "checked" : ""}/> Required</label>
        </div>`;
      return;
    }

    const isSystem = field.mappingType === "system";
    const showOptions = ["select", "radio", "multiselect"].includes(field.fieldType) && !isSystem;
    const otherFields = fields.filter(f => f.key !== field.key);

    // For a single-choice field (Dropdown/select or Radio), the "Default
    // value" control offers exactly its own choices - the field's own
    // static options for a custom field, or the company's live data
    // (sources/owners/stages/campaigns) for a CRM field - instead of a
    // freeform text box the admin would have to match by hand. Multiselect
    // keeps the plain text box below since FormRenderer only pre-checks an
    // array value for it, not a single default string.
    const defaultChoices = ["select", "radio"].includes(field.fieldType) ? fieldChoices(field) : null;
    const defaultValueHtml = field.fieldType === "checkbox" ? "" : defaultChoices
      ? `<label for="set_default">Default value</label>
         <select id="set_default">
           <option value="">No default</option>
           ${defaultChoices.map(c => `<option value="${App.escapeHtml(String(c.value))}" ${String(field.defaultValue ?? "") === String(c.value) ? "selected" : ""}>${App.escapeHtml(c.label)}</option>`).join("")}
         </select>`
      : `<label for="set_default">Default value</label><input id="set_default" value="${App.escapeHtml(field.defaultValue || "")}" />`;

    panel.innerHTML = `
      <div class="field-settings">
        <label for="set_label">Label</label>
        <input id="set_label" value="${App.escapeHtml(field.label)}" />

        ${isSystem
          ? `<p class="hint">CRM field — maps to <code>${App.escapeHtml(field.systemField)}</code>, choices are always this company's live data.</p>`
          : `<label for="set_key">Field key</label><input id="set_key" value="${App.escapeHtml(field.key)}" /><p class="hint">Stored under this key in the customer's custom fields.</p>`}

        <label for="set_placeholder">Placeholder</label>
        <input id="set_placeholder" value="${App.escapeHtml(field.placeholder || "")}" />

        <label for="set_help">Help text</label>
        <input id="set_help" value="${App.escapeHtml(field.helpText || "")}" />

        ${defaultValueHtml}

        <label class="checkbox-option" style="margin-top:10px"><input type="checkbox" id="set_required" ${field.required ? "checked" : ""}/> Required</label>

        ${showOptions ? `
          <label style="margin-top:12px">Options</label>
          <div id="optionsList">${(field.options || []).map(optionRowHtml).join("")}</div>
          <button type="button" class="btn secondary" id="addOptionBtn" style="margin-top:8px">+ Add option</button>
        ` : ""}

        <label style="margin-top:14px">Show only if…</label>
        <div class="grid-2">
          <select id="set_condField">
            <option value="">No condition</option>
            ${otherFields.map(f => `<option value="${f.key}" ${field.conditional && field.conditional.fieldKey === f.key ? "selected" : ""}>${App.escapeHtml(f.label)}</option>`).join("")}
          </select>
          <select id="set_condOp">
            <option value="equals" ${!field.conditional || field.conditional.operator !== "not_equals" ? "selected" : ""}>equals</option>
            <option value="not_equals" ${field.conditional && field.conditional.operator === "not_equals" ? "selected" : ""}>does not equal</option>
          </select>
        </div>
        <input id="set_condValue" placeholder="value" value="${App.escapeHtml(field.conditional ? field.conditional.value : "")}" style="margin-top:8px" />

        <button type="button" class="btn" id="applyFieldSettings" style="margin-top:16px; width:100%">Apply</button>
      </div>
    `;

    document.getElementById("addOptionBtn")?.addEventListener("click", () => {
      field.options = [...(field.options || []), `Option ${(field.options || []).length + 1}`];
      renderSettings();
    });
    panel.querySelectorAll("[data-remove-option]").forEach(btn => {
      btn.addEventListener("click", () => {
        const i = Number(btn.dataset.removeOption);
        field.options = (field.options || []).filter((_, idx) => idx !== i);
        renderSettings();
      });
    });

    document.getElementById("applyFieldSettings").addEventListener("click", () => {
      field.label = document.getElementById("set_label").value.trim() || field.label;
      if (!isSystem) {
        const newKey = document.getElementById("set_key").value.trim();
        if (newKey && newKey !== field.key && /^[a-zA-Z][a-zA-Z0-9_]*$/.test(newKey) && !fields.some(f => f !== field && f.key === newKey)) {
          field.key = newKey;
          selectedKey = newKey;
        }
      }
      field.placeholder = document.getElementById("set_placeholder").value.trim() || null;
      field.helpText = document.getElementById("set_help").value.trim() || null;
      const defaultEl = document.getElementById("set_default");
      field.defaultValue = defaultEl ? (defaultEl.value.trim() || null) : null;
      field.required = document.getElementById("set_required").checked;
      if (showOptions) {
        field.options = Array.from(panel.querySelectorAll(".option-input")).map(el => el.value.trim()).filter(Boolean);
      }
      const condField = document.getElementById("set_condField").value;
      field.conditional = condField
        ? { fieldKey: condField, operator: document.getElementById("set_condOp").value, value: document.getElementById("set_condValue").value.trim() }
        : null;
      renderAll();
    });
  }

  function renderAll(){
    renderCanvas();
    renderSettings();
    renderFormSettingsPanel();
  }

  // ---- Preview modal (same FormRenderer as production) -----------------

  function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }

  function openPreview(){
    const html = FormRenderer.renderFields(fields, {}, { dynamicOptions: dynamicOptionsMap() });
    document.getElementById("modalRoot").innerHTML = `
      <div class="modal-overlay" id="previewOverlay">
        <div class="modal" style="max-width:540px">
          <div class="modal-header">
            <div><h2>${App.escapeHtml(form?.name || "Preview")}</h2><p>${form?.description ? App.escapeHtml(form.description) : "Exactly what production renders."}</p></div>
            <button class="modal-close" type="button" id="previewClose" aria-label="Close">✕</button>
          </div>
          <div class="modal-body">
            <div class="segmented" id="previewViewport" style="margin-bottom:14px">
              <button type="button" data-vp="desktop" class="active">Desktop</button>
              <button type="button" data-vp="mobile">Mobile</button>
            </div>
            <div id="previewFrame" class="preview-frame desktop">
              ${html}
              <button type="button" class="btn" style="margin-top:10px" disabled>${form?.type === "public" ? "Submit" : "Save"} (preview only)</button>
            </div>
          </div>
        </div>
      </div>`;
    document.getElementById("previewClose").addEventListener("click", closeModal);
    document.getElementById("previewOverlay").addEventListener("click", (e) => { if (e.target.id === "previewOverlay") closeModal(); });
    document.getElementById("previewViewport").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-vp]");
      if (!btn) return;
      document.querySelectorAll("#previewViewport button").forEach(b => b.classList.toggle("active", b === btn));
      document.getElementById("previewFrame").className = `preview-frame ${btn.dataset.vp}`;
    });
  }

  // ---- Load / Save --------------------------------------------------

  function fieldsPayload(){
    return fields.map(({ key, label, fieldType, mappingType, systemField, options, placeholder, helpText, defaultValue, required, conditional }) =>
      ({ key, label, fieldType, mappingType, systemField, options, placeholder, helpText, defaultValue, required, conditional }));
  }

  function applyFormMeta(){
    document.getElementById("formTitle").textContent = form.name;
    document.getElementById("formSub").textContent =
      `${form.type === "public" ? "Public lead-capture form" : "Internal form"} · ${form.status}${form.isDefault ? " · Default Add Customer form" : ""}`;
    document.getElementById("metaName").value = form.name;
    document.getElementById("metaDescription").value = form.description || "";
    document.getElementById("publishBtn").style.display = form.status === "draft" ? "inline-flex" : "none";
    // For a published form (always true for the default form - it can only
    // be flagged default while published, see setDefaultInternalForm) this
    // button applies changes immediately, there's no separate publish step,
    // so "Save draft" would be misleading.
    document.getElementById("saveBtn").textContent = form.status === "draft" ? "Save draft" : "Save changes";
    document.getElementById("archiveBtn").style.display = form.status === "published" ? "inline-flex" : "none";
    document.getElementById("setDefaultBtn").style.display = form.type === "internal" && form.status === "published" && !form.isDefault ? "inline-flex" : "none";
    document.getElementById("resetDefaultBtn").style.display = form.isDefault ? "inline-flex" : "none";
  }

  async function loadSupportingData(){
    try {
      const data = await App.apiJson("/api/pipeline");
      sources = data.sources || [];
      owners = data.owners || [];
      template = data.template || null;
      stages = (data.template && data.template.stages) || [];
    } catch { /* non-fatal - dynamic option lists just stay empty */ }
    try {
      const { campaigns: c } = await App.apiJson("/api/campaigns");
      campaigns = c || [];
    } catch { /* non-fatal */ }
    try {
      myBranches = await App.apiJson("/api/branches/mine");
    } catch {
      myBranches = { scope: "all", branches: [] }; // non-fatal - Branch Configuration just falls back to "All Branches" only
    }
  }

  // "meta_lead_ads"/"public_form" are set automatically by ingestion/public
  // submission and are never offered as a manual default - same picklist
  // MANUAL_LEAD_SOURCES already restricts to in src/domain/industryTemplates.ts.
  function manualSources(){
    return sources.filter(s => s.key !== "meta_lead_ads" && s.key !== "public_form");
  }

  // ---- Form settings (Branch Configuration + CRM defaults) --------------

  function initFormSettingsFromForm(){
    formSettings = {
      branchMode: form.branchMode || "all",
      branchId: form.branchId || null,
      branchFieldKey: form.branchFieldKey || null,
      branchFieldMap: { ...(form.branchFieldMap || {}) },
      defaultPipelineStage: form.defaultPipelineStage || null,
      defaultCrmCampaignId: form.defaultCrmCampaignId || null,
      defaultSource: form.defaultSource || null,
      defaultOwnerId: form.defaultOwnerId || null,
    };
  }

  function formSettingsPayload(){
    return {
      branchMode: formSettings.branchMode,
      branchId: formSettings.branchMode === "specific" ? formSettings.branchId : null,
      branchFieldKey: formSettings.branchMode === "field" ? formSettings.branchFieldKey : null,
      branchFieldMap: formSettings.branchMode === "field" ? formSettings.branchFieldMap : {},
      defaultPipelineStage: formSettings.defaultPipelineStage || null,
      defaultCrmCampaignId: formSettings.defaultCrmCampaignId || null,
      defaultSource: formSettings.defaultSource || null,
      defaultOwnerId: formSettings.defaultOwnerId || null,
    };
  }

  // Fields eligible to drive "Determine branch from form field" - a custom
  // (not CRM) Dropdown or Radio field, since only those carry a fixed,
  // enumerable option list to map from.
  function branchEligibleFields(){
    return fields.filter(f => f.mappingType === "custom" && ["select", "radio"].includes(f.fieldType) && (f.options || []).length > 0);
  }

  function branchOptionsHtml(selectedId, opts){
    opts = opts || {};
    const branches = (myBranches && myBranches.branches) || [];
    return `<option value="">${opts.allLabel || "All branches (company-wide)"}</option>` +
      branches.map(b => `<option value="${b.id}" ${b.id === selectedId ? "selected" : ""}>${App.escapeHtml(b.name)}</option>`).join("");
  }

  function renderFormSettingsPanel(){
    const body = document.getElementById("formSettingsBody");
    if (!form) { body.innerHTML = ""; return; }

    const pipelineName = template?.pipelineName || "—";
    const eligibleFields = branchEligibleFields();
    const branches = (myBranches && myBranches.branches) || [];
    const noBranchesYet = branches.length === 0;

    body.innerHTML = `
      <div class="grid-2">
        <div>
          <label>Industry</label>
          <input value="${App.escapeHtml(template?.name || "—")}" disabled />
        </div>
        <div>
          <label>Form type</label>
          <input value="${form.type === "public" ? "Public (external lead capture)" : "Internal (used inside the CRM)"}" disabled />
        </div>
      </div>
      <div class="grid-2">
        <div>
          <label>Pipeline</label>
          <input value="${App.escapeHtml(pipelineName)}" disabled />
        </div>
        <div>
          <label for="set_initialStage">Initial stage</label>
          <select id="set_initialStage">
            <option value="">Pipeline's own default</option>
            ${stages.map(s => `<option value="${s.key}" ${formSettings.defaultPipelineStage === s.key ? "selected" : ""}>${App.escapeHtml(s.label)}</option>`).join("")}
          </select>
        </div>
      </div>

      <label style="margin-top:4px">Branch</label>
      <div class="segmented" id="set_branchMode" role="tablist" aria-label="Branch configuration">
        <button type="button" data-mode="specific" role="tab" class="${formSettings.branchMode === "specific" ? "active" : ""}">Specific Branch</button>
        <button type="button" data-mode="all" role="tab" class="${formSettings.branchMode === "all" ? "active" : ""}">All Branches</button>
        <button type="button" data-mode="field" role="tab" class="${formSettings.branchMode === "field" ? "active" : ""}">Determine from Form Field</button>
      </div>

      <div id="branchModeBody" style="margin-top:10px">
        ${formSettings.branchMode === "specific" ? `
          ${noBranchesYet ? `<p class="hint">No branches to choose from yet — set them up under Settings / Branches first.</p>` : `
            <label for="set_branchId">Branch</label>
            <select id="set_branchId">${branchOptionsHtml(formSettings.branchId)}</select>
          `}
        ` : ""}
        ${formSettings.branchMode === "field" ? `
          ${eligibleFields.length === 0
            ? `<p class="hint">Add a Dropdown or Radio field with options first (e.g. "Which location are you interested in?"), then choose it here.</p>`
            : `
              <label for="set_branchFieldKey">Branch-determining field</label>
              <select id="set_branchFieldKey">
                <option value="">Select a field…</option>
                ${eligibleFields.map(f => `<option value="${f.key}" ${formSettings.branchFieldKey === f.key ? "selected" : ""}>${App.escapeHtml(f.label)}</option>`).join("")}
              </select>
              <div id="branchFieldMapRows" style="margin-top:10px"></div>
              <p class="hint">Each option's answer picks the branch a lead is assigned to. An option left on "All branches" stays company-wide.</p>
            `}
        ` : ""}
      </div>

      <div class="grid-2" style="margin-top:14px">
        <div>
          <label for="set_campaign">Campaign</label>
          <select id="set_campaign">
            <option value="">No campaign</option>
            ${campaigns.map(c => `<option value="${c.id}" ${formSettings.defaultCrmCampaignId === c.id ? "selected" : ""}>${App.escapeHtml(c.name)}</option>`).join("")}
          </select>
        </div>
        <div>
          <label for="set_source">Lead source</label>
          <select id="set_source">
            <option value="">${form.type === "public" ? "Website Form (automatic)" : "No default"}</option>
            ${manualSources().map(s => `<option value="${s.key}" ${formSettings.defaultSource === s.key ? "selected" : ""}>${App.escapeHtml(s.label)}</option>`).join("")}
          </select>
        </div>
      </div>
      <label for="set_owner">Default owner</label>
      <select id="set_owner">
        <option value="">Unassigned</option>
        ${owners.map(o => `<option value="${o.id}" ${formSettings.defaultOwnerId === o.id ? "selected" : ""}>${App.escapeHtml(o.fullName)}</option>`).join("")}
      </select>
    `;

    document.getElementById("set_initialStage").addEventListener("change", (e) => { formSettings.defaultPipelineStage = e.target.value || null; });
    document.getElementById("set_campaign").addEventListener("change", (e) => { formSettings.defaultCrmCampaignId = e.target.value || null; });
    document.getElementById("set_source").addEventListener("change", (e) => { formSettings.defaultSource = e.target.value || null; });
    document.getElementById("set_owner").addEventListener("change", (e) => { formSettings.defaultOwnerId = e.target.value || null; });

    document.getElementById("set_branchMode").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-mode]");
      if (!btn) return;
      formSettings.branchMode = btn.dataset.mode;
      renderFormSettingsPanel();
    });

    document.getElementById("set_branchId")?.addEventListener("change", (e) => { formSettings.branchId = e.target.value || null; });

    document.getElementById("set_branchFieldKey")?.addEventListener("change", (e) => {
      formSettings.branchFieldKey = e.target.value || null;
      renderBranchFieldMapRows();
    });
    renderBranchFieldMapRows();
  }

  function renderBranchFieldMapRows(){
    const container = document.getElementById("branchFieldMapRows");
    if (!container) return;
    const field = branchEligibleFields().find(f => f.key === formSettings.branchFieldKey);
    if (!field) { container.innerHTML = ""; return; }
    container.innerHTML = (field.options || []).map((opt, i) => `
      <div class="grid-2" style="margin-top:6px; align-items:center">
        <label style="margin:0">${App.escapeHtml(opt)}</label>
        <select data-map-option="${App.escapeHtml(opt)}">${branchOptionsHtml(formSettings.branchFieldMap[opt] || "")}</select>
      </div>
    `).join("");
    container.querySelectorAll("[data-map-option]").forEach(sel => {
      sel.addEventListener("change", () => {
        const opt = sel.dataset.mapOption;
        if (sel.value) formSettings.branchFieldMap[opt] = sel.value;
        else delete formSettings.branchFieldMap[opt];
      });
    });
  }

  async function load(){
    me = await App.requireAuth();
    if (!me) return;
    App.renderNav(me, "/forms.html");
    canManage = App.hasPermission(me, "forms.manage");
    if (!canManage) {
      document.getElementById("formSub").textContent = "You don't have permission to edit forms.";
      return;
    }
    if (!formId) {
      showBanner("No form selected.", "error");
      return;
    }

    document.getElementById("headActions").style.display = "flex";
    await loadSupportingData();

    try {
      const result = await App.apiJson(`/api/forms/${formId}`);
      form = result.form;
      fields = result.fields.map(f => ({ ...f }));
    } catch (err) {
      showBanner(err.message, "error");
      return;
    }

    initFormSettingsFromForm();
    applyFormMeta();
    renderPalette();
    renderAll();
  }

  document.getElementById("saveBtn").addEventListener("click", async () => {
    try {
      await App.apiJson(`/api/forms/${formId}`, {
        method: "PUT",
        body: {
          name: document.getElementById("metaName").value.trim(),
          description: document.getElementById("metaDescription").value.trim(),
          fields: fieldsPayload(),
          ...formSettingsPayload(),
        },
      });
      showBanner("Draft saved.", "success");
      const result = await App.apiJson(`/api/forms/${formId}`);
      form = result.form;
      fields = result.fields.map(f => ({ ...f }));
      initFormSettingsFromForm();
      applyFormMeta();
      renderAll();
    } catch (err) {
      showBanner(err.message, "error");
    }
  });

  document.getElementById("publishBtn").addEventListener("click", async () => {
    try {
      await App.apiJson(`/api/forms/${formId}`, {
        method: "PUT",
        body: {
          name: document.getElementById("metaName").value.trim(),
          description: document.getElementById("metaDescription").value.trim(),
          fields: fieldsPayload(),
          ...formSettingsPayload(),
        },
      });
      await App.apiJson(`/api/forms/${formId}/publish`, { method: "POST" });
      showBanner("Form published.", "success");
      await load();
    } catch (err) {
      showBanner(err.message, "error");
    }
  });

  document.getElementById("resetDefaultBtn").addEventListener("click", () => {
    // The default form is always status "published" (it can only be flagged
    // default while published - see setDefaultInternalForm), so the Publish
    // button never appears here; saving applies the change immediately.
    const saveLabel = form.status === "draft" ? "Save draft" : "Save changes";
    if (!confirm(`Reset this form to exactly how it was originally created — Name, Phone, Email, your industry's fields, then Source, Owner, Pipeline Stage, Next Follow-up and Notes, in that order? Any fields you've added since will be removed from this draft. This only changes what's shown here — click "${saveLabel}" to make it live again.`)) return;
    const industryKey = me?.company?.industry;
    fields = defaultFormFieldsForIndustry(industryKey);
    document.getElementById("metaName").value = `${template?.name || form.name} - Add Customer`;
    document.getElementById("metaDescription").value = "Default internal form used by Add Customer and Not Interested → Add to CRM on the Pipeline board.";
    selectedKey = null;
    renderAll();
    showBanner(`Fields reset to the original default form. Click "${saveLabel}" to make it live.`, "success");
  });

  document.getElementById("archiveBtn").addEventListener("click", async () => {
    if (!confirm("Archive this form? It stops being used by Add Customer / its public link, but past submissions stay intact.")) return;
    try {
      await App.apiJson(`/api/forms/${formId}/archive`, { method: "POST" });
      showBanner("Form archived.", "success");
      await load();
    } catch (err) {
      showBanner(err.message, "error");
    }
  });

  document.getElementById("setDefaultBtn").addEventListener("click", async () => {
    try {
      await App.apiJson(`/api/forms/${formId}/set-default`, { method: "POST" });
      showBanner("Set as the default Add Customer form.", "success");
      await load();
    } catch (err) {
      showBanner(err.message, "error");
    }
  });

  document.getElementById("previewBtn").addEventListener("click", openPreview);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.getElementById("modalRoot").innerHTML.trim()) closeModal(); });

  load();
</script>
</body>
</html>
