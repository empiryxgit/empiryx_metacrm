<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Platform Administration</title>
<link rel="stylesheet" href="/assets/app.css" />
<style>
body{background:var(--surface-sunken,#f6f4f0)}.admin-wrap{max-width:1180px;margin:0 auto;padding:28px 20px}.admin-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.admin-head h1{margin:0 0 6px}.admin-head p{margin:0;color:var(--text-muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:10px}.stat-label{font-size:12px;color:var(--text-muted)}.stat-value{font-size:25px;font-weight:800;margin-top:5px}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{max-width:320px;margin:0}.table-wrap{overflow-x:auto}.admin-table{width:100%;border-collapse:collapse;min-width:900px}.admin-table th,.admin-table td{padding:12px 10px;border-bottom:1px solid var(--border);text-align:left;font-size:12.5px}.admin-table th{font-size:11px;text-transform:uppercase;color:var(--text-muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--brand-primary-soft);color:var(--brand-primary-hover);font-size:11px;font-weight:700}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.admin-head{display:block}.admin-head button{margin-top:14px}}
</style>
</head>
<body>
<main class="admin-wrap">
  <header class="admin-head"><div><h1>Platform Administration</h1><p>System-wide visibility across independent customer accounts.</p></div><button class="btn" id="logout">Sign out</button></header>
  <section class="stats" id="stats"></section>
  <section class="card"><div class="toolbar"><input id="search" placeholder="Search customer accounts" /><button class="btn" id="searchBtn">Search</button></div><div id="content">Loading…</div></section>
</main>
<script>
  const escapeHtml = (value) => String(value ?? "").replace(/[&<>\"]/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));
  const date = (value) => value ? new Date(value).toLocaleDateString("en-IN", { day:"numeric", month:"short", year:"numeric" }) : "-";
  async function load() {
    const query = search.value.trim();
    const response = await fetch(`/api/platform-admin/dashboard${query ? `?search=${encodeURIComponent(query)}` : ""}`);
    const data = await response.json();
    if (response.status === 401) { window.location.href = "/admin/login.html"; return; }
    if (!response.ok) throw new Error(data.error || "Unable to load dashboard.");
    const summary = data.summary;
    stats.innerHTML = [["Users",summary.users],["Customer accounts",summary.companies],["Agencies",summary.agencies],["Agency clients",summary.clients],["Active subscriptions",summary.activeSubscriptions],["Active trials",summary.activeTrials],["Expired trials",summary.expiredTrials],["Expired subscriptions",summary.expiredSubscriptions]].map(([label,value]) => `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`).join("");
    content.innerHTML = data.companies.length ? `<div class="table-wrap"><table class="admin-table"><thead><tr><th>Account</th><th>Type</th><th>Status</th><th>Trial / subscription</th><th>Usage</th><th>Registered</th></tr></thead><tbody>${data.companies.map((company) => `<tr><td><strong>${escapeHtml(company.name)}</strong><br><small>${escapeHtml(company.slug)}</small></td><td><span class="pill">${escapeHtml(company.accountType)}</span></td><td>${escapeHtml(company.status)}</td><td>${escapeHtml(company.subscriptionStatus)}<br><small>${company.subscriptionStatus === "trialing" ? `${date(company.trialEndsAt)} trial end` : date(company.subscriptionExpiresAt)}</small></td><td>${company.accountType === "agency" ? `${company.clientCount} clients · ` : ""}${company.campaignCount} campaigns · ${company.leadCount} leads</td><td>${date(company.createdAt)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="state-block"><p class="state-title">No accounts found</p></div>`;
  }
  searchBtn.addEventListener("click", () => load().catch((err) => { content.textContent = err.message; }));
  search.addEventListener("keydown", (event) => { if (event.key === "Enter") load().catch((err) => { content.textContent = err.message; }); });
  logout.addEventListener("click", async () => { await fetch("/api/platform-admin/logout", { method:"POST" }); window.location.href = "/admin/login.html"; });
  load().catch((err) => { content.textContent = err.message; });
</script>
</body>
</html>
