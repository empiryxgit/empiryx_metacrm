<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create your account — RUTA Lead Management System</title>
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card" style="width:440px">
      <h1 id="stepTitle">Create your account</h1>
      <p class="sub" id="stepSub">Sets up your company workspace — you'll be the Owner.</p>
      <div class="steps">
        <div class="step active" id="s1"></div>
        <div class="step" id="s2"></div>
      </div>
      <div id="banner"></div>

      <!-- Step 1: Basic Information. Industry selection has been removed
           from registration entirely - see src/application/auth.ts's
           RegisterInput.industry comment; every new company defaults to
           the "real_estate" CRM template and this form never sends a
           value for it. -->
      <form id="step1">
        <label for="companyName">Company name</label>
        <input id="companyName" required autocomplete="organization" />

        <label for="fullName">Your full name</label>
        <input id="fullName" required autocomplete="name" />

        <label for="email">Work email</label>
        <input id="email" type="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input id="password" type="password" required minlength="10" autocomplete="new-password" />
        <div class="hint">At least 10 characters.</div>

        <button class="btn full" type="submit">Continue</button>
      </form>

      <!-- Step 2: Account Type - "individual" | "agency", see
           src/domain/accountType.ts for the fixed catalog this mirrors.
           An organization-level classification (stored on companies, not
           users - see that file's own comment), same pattern the old
           industry-selection step used to follow. -->
      <form id="step2" style="display:none">
        <label>What type of account is this?</label>
        <div class="choice-group" role="radiogroup" aria-label="Account type">
          <label class="choice-card">
            <input type="radio" name="accountType" value="individual" checked />
            <span class="choice-card-title">Individual</span>
            <span class="choice-card-desc">Just me - I work my own leads.</span>
          </label>
          <label class="choice-card">
            <input type="radio" name="accountType" value="agency" />
            <span class="choice-card-title">Agency</span>
            <span class="choice-card-desc">My team manages leads on behalf of clients.</span>
          </label>
        </div>

        <div style="display:flex; gap:10px; margin-top:14px">
          <button class="btn secondary" type="button" id="backBtn">Back</button>
          <button class="btn full" type="submit" id="submitBtn">Create account</button>
        </div>
      </form>

      <div class="switch">Already have an account? <a href="/login.html">Sign in</a></div>
    </div>
  </div>

<script src="/assets/app.js"></script>
<script>
  const step1 = document.getElementById("step1");
  const step2 = document.getElementById("step2");
  const banner = document.getElementById("banner");
  const submitBtn = document.getElementById("submitBtn");

  // Step 1 -> Step 2 is purely a client-side transition: nothing is sent to
  // the server until step 2 submits, so a user who abandons partway through
  // never leaves a half-created account behind.
  step1.addEventListener("submit", (e) => {
    e.preventDefault();
    document.getElementById("s1").classList.add("done");
    document.getElementById("s2").classList.add("active");
    document.getElementById("stepTitle").textContent = "Account type";
    document.getElementById("stepSub").textContent = "Are you working alone, or as part of an agency/team?";
    step1.style.display = "none";
    step2.style.display = "block";
  });

  document.getElementById("backBtn").addEventListener("click", () => {
    document.getElementById("s2").classList.remove("active");
    document.getElementById("s1").classList.remove("done");
    document.getElementById("stepTitle").textContent = "Create your account";
    document.getElementById("stepSub").textContent = "Sets up your company workspace — you'll be the Owner.";
    step2.style.display = "none";
    step1.style.display = "block";
  });

  // Step 2 - account type, then the actual registration call. All step 1
  // fields are still in the DOM (just hidden), so their values are read
  // here rather than being carried in JS state.
  step2.addEventListener("submit", async (e) => {
    e.preventDefault();
    banner.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating…";
    try {
      const accountType = document.querySelector('input[name="accountType"]:checked')?.value || "individual";
      await App.apiJson("/api/auth/register", {
        method: "POST",
        body: {
          companyName: document.getElementById("companyName").value.trim(),
          fullName: document.getElementById("fullName").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
          accountType,
        },
      });
      window.location.href = "/onboarding.html";
    } catch (err) {
      banner.innerHTML = `<div class="banner error">${App.escapeHtml(err.message)}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = "Create account";
    }
  });
</script>
</body>
</html>
