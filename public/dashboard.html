<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — Setu CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <nav class="topnav" id="topnav" style="display:none"></nav>
  <div class="wrap">
    <div class="page-head">
      <div class="page-head-text">
        <h1 class="page-title">Dashboard</h1>
        <p class="page-sub">A quick read on your leads, customers and what needs attention.</p>
      </div>
      <div class="page-head-actions">
        <span class="status-updated" id="refreshedAt">Loading…</span>
        <button class="refresh-btn" id="refreshBtn" type="button" aria-label="Refresh dashboard">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="kpi-grid" id="kpiGrid"></div>

    <div class="page-head" style="margin-top:var(--space-8)">
      <div class="page-head-text">
        <h2 class="section-title" style="margin-top:0">Recent leads &amp; customers</h2>
      </div>
      <div class="page-head-actions">
        <a href="/pipeline.html" class="btn secondary sm" style="display:inline-flex">Open pipeline →</a>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Lead</th><th>Received</th><th>Campaign</th><th>Source</th><th>Stage</th></tr></thead>
        <tbody id="leadsBody"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

<script src="/assets/app.js"></script>
<script>
  const MOCK_TEMPLATE = {
    stages: [
      { key: "new", label: "New Inquiry", isInitial: true },
      { key: "contacted", label: "Contacted" },
      { key: "qualified", label: "Qualified" },
      { key: "won", label: "Won", isClosed: true, isWon: true },
      { key: "lost", label: "Lost", isClosed: true },
    ],
  };
  const MOCK_SOURCES = [
    { key: "meta_lead_ads", label: "Meta Lead Ads" },
    { key: "referral", label: "Referral" },
  ];
  const MOCK_LEADS = Array.from({ length: 6 }).map((_, i) => ({
    id: "mock-" + i,
    metaLeadId: "12345678900" + i,
    fullName: ["Asha Rao", "Vikram Nair", "Priya Menon", "Rahul Sethi", "Divya Iyer", "Amit Shah"][i % 6],
    campaignName: i % 2 === 0 ? ["Site Visit — Aug", "Diwali Offer"][i % 2] : null,
    source: i % 3 === 0 ? "referral" : "meta_lead_ads",
    pipelineStage: ["new", "contacted", "qualified", "won", "lost", "new"][i % 6],
    createdAt: new Date(Date.now() - i * 9 * 60000).toISOString(),
  }));
  const mockBoard = { new: [MOCK_LEADS[0], MOCK_LEADS[5]], contacted: [MOCK_LEADS[1]], qualified: [MOCK_LEADS[2]], won: [MOCK_LEADS[3]], lost: [MOCK_LEADS[4]] };

  function fmtTime(iso){
    if (!iso) return "—";
    return new Date(iso).toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
  }

  function computeKpis(template, board){
    const stageInfo = Object.fromEntries(template.stages.map(s => [s.key, s]));
    let total = 0, open = 0, won = 0, lost = 0, dueToday = 0, newThisWeek = 0;
    const endOfToday = new Date(); endOfToday.setHours(23, 59, 59, 999);
    const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);

    Object.entries(board).forEach(([stageKey, rows]) => {
      const info = stageInfo[stageKey] || {};
      total += rows.length;
      if (info.isWon) won += rows.length;
      else if (info.isClosed) lost += rows.length;
      else open += rows.length;
      rows.forEach(r => {
        if (r.nextFollowUpAt && new Date(r.nextFollowUpAt) <= endOfToday) dueToday++;
        if (r.createdAt && new Date(r.createdAt) >= weekAgo) newThisWeek++;
      });
    });
    return { total, open, won, lost, dueToday, newThisWeek };
  }

  function renderKpis(k){
    const cards = [
      { label: "Total Leads & Customers", value: k.total, note: k.total === 0 ? "Nothing here yet" : "" },
      { label: "Open in Pipeline", value: k.open, note: k.open === 0 ? "Nothing in progress" : "" },
      { label: "Won", value: k.won, tone: k.won > 0 ? "success" : "", note: k.won === 0 ? "No wins yet" : "" },
      { label: "Lost", value: k.lost, note: k.lost === 0 ? "No losses" : "" },
      { label: "Follow-ups Due Today", value: k.dueToday, tone: k.dueToday > 0 ? "warning" : "", note: k.dueToday === 0 ? "Nothing due today" : "" },
      { label: "New This Week", value: k.newThisWeek, note: k.newThisWeek === 0 ? "No new activity" : "" },
    ];
    document.getElementById("kpiGrid").innerHTML = cards.map(c => `
      <div class="kpi-card ${c.tone ? "is-" + c.tone : ""}">
        <div class="kpi-label">${c.label}</div>
        <div class="kpi-value">${c.value.toLocaleString()}</div>
        ${c.note ? `<div class="kpi-note">${c.note}</div>` : ""}
      </div>`).join("");
  }

  function renderLeads(leads, template, sources){
    const stageLabel = (key) => (template.stages.find(s => s.key === key)?.label) || key || "—";
    const sourceLabel = (key) => sources.find(s => s.key === key)?.label || key || "—";
    const body = document.getElementById("leadsBody");
    if (!leads.length){
      body.innerHTML = `<tr><td colspan="5">
        <div class="state-block">
          <div class="state-icon">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 6.5 10 11l7-4.5M3 6.5v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7M3 6.5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <p class="state-title">No leads yet</p>
          <p class="state-desc">Once leads arrive from your connected campaigns, or you add a customer manually, they will appear here.</p>
          <div class="state-actions"><a href="/pipeline.html" class="btn secondary" style="display:inline-flex">Open pipeline</a></div>
        </div>
      </td></tr>`;
      return;
    }
    body.innerHTML = leads.map(l => `
      <tr>
        <td>
          <div class="lead-identity">
            <div class="lead-name">${App.escapeHtml(l.fullName || "Unnamed lead")}</div>
          </div>
        </td>
        <td>${fmtTime(l.createdAt)}</td>
        <td>${App.escapeHtml(l.campaignName || "—")}</td>
        <td>${App.escapeHtml(sourceLabel(l.source))}</td>
        <td><span class="pill ${l.pipelineStage === "won" ? "processed" : l.pipelineStage === "lost" ? "failed" : "pending"}">${App.escapeHtml(stageLabel(l.pipelineStage))}</span></td>
      </tr>
    `).join("");
  }

  async function load(){
    const refreshBtn = document.getElementById("refreshBtn");
    refreshBtn.classList.add("is-loading");

    // Distinguish "no backend reachable at all" (standalone preview - show
    // sample data) from "backend reachable but not logged in" (redirect).
    let me;
    try {
      me = await App.apiJson("/api/auth/me");
    } catch (err) {
      if (err.message && err.message.includes("Not authenticated")) {
        window.location.href = "/login.html?next=/dashboard.html";
        return;
      }
      // network/connection failure - fall through to sample-data mode
    }

    if (me) {
      // A real, logged-in session - never fall back to sample data past
      // this point. A fetch failure here (including a permissions gap on
      // a restricted role) gets a real error state, not fabricated numbers.
      document.getElementById("topnav").style.display = "flex";
      App.renderNav(me, "/dashboard.html");
      try {
        const [pipelineData, leadsRes] = await Promise.all([
          App.apiJson("/api/pipeline"),
          App.apiJson("/api/leads?limit=15"),
        ]);
        renderKpis(computeKpis(pipelineData.template, pipelineData.board));
        renderLeads(leadsRes.leads, pipelineData.template, pipelineData.sources);
        document.getElementById("refreshedAt").textContent = "Updated " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("kpiGrid").innerHTML = "";
        document.getElementById("leadsBody").innerHTML = `<tr><td colspan="5">
          <div class="state-block">
            <p class="state-title">Unable to load dashboard data</p>
            <p class="state-desc">${App.escapeHtml(err.message || "Something went wrong.")}</p>
            <div class="state-actions"><button class="btn secondary" id="retryBtn" type="button">Try again</button></div>
          </div>
        </td></tr>`;
        document.getElementById("retryBtn")?.addEventListener("click", load);
        document.getElementById("refreshedAt").textContent = "";
      }
      refreshBtn.classList.remove("is-loading");
      return;
    }

    renderKpis(computeKpis(MOCK_TEMPLATE, mockBoard));
    renderLeads(MOCK_LEADS, MOCK_TEMPLATE, MOCK_SOURCES);
    document.getElementById("refreshedAt").textContent = "Updated " + new Date().toLocaleTimeString() + " (sample data)";
    refreshBtn.classList.remove("is-loading");
  }

  document.getElementById("refreshBtn").addEventListener("click", load);
  load();
  setInterval(load, 30000);
</script>
</body>
</html>
