<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Set a new password — RUTA Lead Management System</title>
<link rel="stylesheet" href="/assets/app.css" />
<style>
  /* This page has no top nav (bare auth-shell layout, reachable from
     login.html's forced mustChangePassword redirect AND from the nav's
     "Account settings" link on every other page - see app.js's renderNav),
     so there's no other way back without this. Styled like client-detail.html's
     own .back-link (a small muted text link) even though it's a <button>
     here, not an <a> - the destination is dynamic (wherever the user came
     from), not one fixed href. */
  .back-link{
    display:inline-flex; align-items:center; gap:6px; font-size:13px;
    color:var(--text-muted); background:none; border:none; padding:0;
    margin-bottom:14px; cursor:pointer; font-family:inherit;
  }
  .back-link:hover{ color:var(--text); }
</style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <button type="button" class="back-link" id="backBtn">← Back</button>
      <h1>Set a new password</h1>
      <p class="sub">You're using a temporary password — choose a permanent one to continue.</p>
      <div id="banner"></div>
      <form id="form">
        <label for="currentPassword">Temporary password</label>
        <input id="currentPassword" type="password" required autocomplete="current-password" />

        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" required minlength="10" autocomplete="new-password" />
        <div class="hint">At least 10 characters.</div>

        <button class="btn full" type="submit" id="submitBtn">Set password</button>
      </form>
    </div>
  </div>

<script src="/assets/app.js"></script>
<script>
  const form = document.getElementById("form");
  const banner = document.getElementById("banner");
  const submitBtn = document.getElementById("submitBtn");

  // "Back" - returns to whichever page redirected here (login.html's forced
  // mustChangePassword flow, or the nav's "Account settings" link from any
  // other page - see app.js's renderNav). history.back() is the correct
  // "wherever I came from" behavior with zero plumbing needed at either
  // call site; document.referrer isn't used instead since it's unreliable
  // (empty on some browsers/privacy settings) and a plain ?next= param
  // would need every one of those call sites updated to pass it. Falls back
  // to /dashboard.html only for the rare case there's no history to go back
  // to (page opened directly) - that page's own auth guard already redirects
  // an agency identity to /agency-dashboard.html and an unauthenticated
  // visitor to /login.html, so this never strands anyone off-app.
  document.getElementById("backBtn").addEventListener("click", () => {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = "/dashboard.html";
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    banner.innerHTML = "";
    submitBtn.disabled = true;
    try {
      await App.apiJson("/api/auth/change-password", {
        method: "POST",
        body: {
          currentPassword: document.getElementById("currentPassword").value,
          newPassword: document.getElementById("newPassword").value,
        },
      });
      banner.innerHTML = `<div class="banner success">Password updated. Redirecting…</div>`;
      setTimeout(() => (window.location.href = "/login.html"), 900);
    } catch (err) {
      banner.innerHTML = `<div class="banner error">${App.escapeHtml(err.message)}</div>`;
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
