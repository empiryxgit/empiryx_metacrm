<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pipeline — Setu CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <nav class="topnav" id="topnav"></nav>
  <div class="wrap" style="max-width:1280px">
    <div class="page-head">
      <div class="page-head-text">
        <h1 class="page-title">Pipeline</h1>
        <p class="page-sub">Manage leads and customers from first contact to conversion.</p>
      </div>
      <div class="page-head-actions">
        <div class="segmented" id="viewToggle" role="tablist" aria-label="Pipeline view">
          <button type="button" data-view="board" role="tab">Board</button>
          <button type="button" data-view="list" role="tab">List</button>
        </div>
      </div>
    </div>

    <div class="board-toolbar">
      <div class="field-inline">
        <label for="campaignSelect">Campaign</label>
        <select id="campaignSelect"></select>
      </div>
      <div class="board-toolbar-right">
        <div class="field-inline" style="max-width:260px">
          <label for="searchInput">Search</label>
          <input id="searchInput" type="text" placeholder="Search leads or customers…" />
        </div>
        <button class="btn" type="button" id="addCustomerBtn" style="display:none">+ Add Customer</button>
      </div>
    </div>

    <div id="stageFilterChip" style="display:none; margin-bottom:var(--space-4)"></div>

    <div id="banner"></div>

    <div id="emptyPipeline" style="display:none"></div>

    <div id="modalRoot"></div>

    <div id="pipelineContent" style="display:none">
      <div class="mobile-stage-select">
        <label for="mobileStage">Stage</label>
        <select id="mobileStage"></select>
        <div id="mobileBoard" style="margin-top:10px; display:flex; flex-direction:column; gap:8px"></div>
      </div>

      <div class="board" id="board"></div>

      <div class="table-wrap" id="listWrap" style="display:none">
        <table id="listTable">
          <thead id="listHead"></thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script src="/assets/app.js"></script>
<script src="/assets/formRenderer.js"></script>
<script>
  let me, canManage, canManageLeads;
  // The company's configured internal form (Add Customer / Not Interested ->
  // Add to CRM), if one exists - see /api/forms/default-internal. Populated
  // once at load; null (and internalFormFields empty) means "no configured
  // form yet", in which case customerModalHtml/submitCustomerModal fall back
  // to their original hard-coded fields/endpoints below, unchanged - a
  // company with no form provisioned yet can never lose this feature.
  let internalForm = null, internalFormFields = [], campaignsList = [];
  let template = null, stages = [], sources = [], owners = [];
  let allRows = [];
  let campaignName = "";
  let viewMode = localStorage.getItem("setu_pipeline_view") === "list" ? "list" : "board";
  // Set when arriving via a link like /pipeline.html?stage=won (e.g. from
  // the Dashboard's pipeline funnel). Cleared by the chip's "Clear" action.
  let stageFilter = new URLSearchParams(window.location.search).get("stage") || null;
  if (stageFilter) viewMode = "list"; // a single-stage filter reads best as a flat list, not a mostly-empty board
  const MANUAL_SOURCES = [
    { key: "referral", label: "Referral" },
    { key: "phone", label: "Phone" },
    { key: "walk_in", label: "Walk-in" },
    { key: "whatsapp", label: "WhatsApp" },
    { key: "website", label: "Website" },
    { key: "other", label: "Other" },
  ];

  const ownerById = () => Object.fromEntries(owners.map(o => [o.id, o.fullName]));
  const sourceLabel = (key) => sources.find(s => s.key === key)?.label || key || "—";
  const stageLabel = (key) => stages.find(s => s.key === key)?.label || key;

  function fmtDate(iso){
    if (!iso) return "—";
    return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function fmtDateTime(iso){
    if (!iso) return "—";
    return new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function fmtFieldValue(field, value){
    if (value === undefined || value === null || value === "") return "—";
    if (field.type === "currency") {
      const n = Number(value);
      return Number.isFinite(n) ? "₹" + n.toLocaleString("en-IN") : App.escapeHtml(String(value));
    }
    if (field.type === "number") {
      return App.escapeHtml(String(value)) + (field.unit ? " " + field.unit : "");
    }
    return App.escapeHtml(String(value));
  }

  function resolvedStage(row){
    return stages.some(s => s.key === row.pipelineStage) ? row.pipelineStage : (stages.find(s => s.isInitial)?.key || stages[0]?.key);
  }

  function applyFilters(rows){
    let out = rows;
    if (stageFilter) out = out.filter(r => resolvedStage(r) === stageFilter);
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    if (!q) return out;
    return out.filter(r =>
      (r.fullName || "").toLowerCase().includes(q) ||
      (r.email || "").toLowerCase().includes(q) ||
      (r.phoneNumber || "").toLowerCase().includes(q) ||
      (r.metaLeadId || "").toLowerCase().includes(q)
    );
  }

  function renderStageFilterChip(){
    const box = document.getElementById("stageFilterChip");
    if (!stageFilter) { box.style.display = "none"; box.innerHTML = ""; return; }
    box.style.display = "block";
    box.innerHTML = `<span class="pill pending" style="display:inline-flex; align-items:center; gap:7px; cursor:default">
      Filtered by stage: <strong>${App.escapeHtml(stageLabel(stageFilter))}</strong>
      <button type="button" id="clearStageFilter" class="icon-action" style="width:18px; height:18px; border:none; padding:0" aria-label="Clear stage filter">✕</button>
    </span>`;
    document.getElementById("clearStageFilter").addEventListener("click", () => {
      stageFilter = null;
      const url = new URL(window.location.href);
      url.searchParams.delete("stage");
      window.history.replaceState({}, "", url);
      renderStageFilterChip();
      renderView();
    });
  }

  function cardContextLine(row){
    const cardField = template.fields.find(f => f.showOnCard);
    if (!cardField) return "";
    const value = row.customFields && row.customFields[cardField.key];
    if (value === undefined || value === null || value === "") return "";
    return `<div class="context-line">${App.escapeHtml(cardField.label)}: ${fmtFieldValue(cardField, value)}</div>`;
  }

  function leadCard(row){
    const owners_ = ownerById();
    const name = row.fullName || "Unnamed lead";
    const contact = row.email || row.phoneNumber || "";
    const ownerName = row.ownerId ? owners_[row.ownerId] : null;
    const showNotInterested = canManageLeads && row.leadType === "digital_lead";
    return `<div class="lead-card" draggable="${canManage}" data-lead-id="${row.id}">
      ${showNotInterested ? `<button type="button" class="card-kebab" data-not-interested="${row.id}" title="Not interested" aria-label="Lead actions">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="3.2" r="1.2" fill="currentColor"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="8" cy="12.8" r="1.2" fill="currentColor"/></svg>
      </button>` : ""}
      <div class="name">${App.escapeHtml(name)}</div>
      ${contact ? `<div class="meta">${App.escapeHtml(contact)}</div>` : ""}
      <span class="source">${App.escapeHtml(sourceLabel(row.source))}</span>
      ${cardContextLine(row)}
      <div class="lead-card-meta-row">
        ${ownerName ? `<span class="avatar avatar-sm" title="${App.escapeHtml(ownerName)}">${App.escapeHtml(App.initials(ownerName))}</span>` : "<span></span>"}
        ${row.nextFollowUpAt ? `<span class="followup">Follow-up ${fmtDate(row.nextFollowUpAt)}</span>` : ""}
      </div>
    </div>`;
  }

  function wireCardActions(root){
    root.querySelectorAll("[data-not-interested]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        e.preventDefault();
        const row = allRows.find(r => r.id === btn.dataset.notInterested);
        if (row) openNotInterestedModal(row);
      });
      btn.addEventListener("dragstart", (e) => e.preventDefault());
    });
  }

  function groupByStage(rows){
    const groups = Object.fromEntries(stages.map(s => [s.key, []]));
    rows.forEach(r => { groups[resolvedStage(r)].push(r); });
    return groups;
  }

  function wireDragDrop(root){
    if (!canManage) return;
    root.querySelectorAll(".lead-card").forEach(card => {
      card.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", card.dataset.leadId));
    });
    root.querySelectorAll(".col-body, .mobile-drop").forEach(col => {
      col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("dragover"); });
      col.addEventListener("dragleave", () => col.classList.remove("dragover"));
      col.addEventListener("drop", async (e) => {
        e.preventDefault();
        col.classList.remove("dragover");
        const leadId = e.dataTransfer.getData("text/plain");
        const stage = col.dataset.stage;
        try {
          await App.apiJson(`/api/leads/${leadId}/stage`, { method: "PATCH", body: { stage } });
          load();
        } catch (err) {
          document.getElementById("banner").innerHTML = `<div class="banner error">${App.escapeHtml(err.message)}</div>`;
        }
      });
    });
  }

  function renderBoard(rows){
    const groups = groupByStage(rows);
    const board = document.getElementById("board");
    board.innerHTML = stages.map(s => `
      <div class="col" data-stage="${s.key}">
        <div class="col-head"><span>${App.escapeHtml(s.label.toUpperCase())}</span><span>${groups[s.key].length}</span></div>
        <div class="col-body" data-stage="${s.key}">${groups[s.key].length ? groups[s.key].map(leadCard).join("") : '<div class="empty" style="padding:16px 8px; font-size:12px">No leads in this stage</div>'}</div>
      </div>
    `).join("");
    wireDragDrop(board);
    wireCardActions(board);

    // Mobile: single-stage selector + card list, fed from the same groups.
    const mobileSelect = document.getElementById("mobileStage");
    const prevValue = mobileSelect.value;
    mobileSelect.innerHTML = stages.map(s => `<option value="${s.key}">${App.escapeHtml(s.label)} (${groups[s.key].length})</option>`).join("");
    if (prevValue && stages.some(s => s.key === prevValue)) mobileSelect.value = prevValue;
    renderMobileStage(groups);
  }

  function renderMobileStage(groups){
    const key = document.getElementById("mobileStage").value || stages[0]?.key;
    const cards = groups[key] || [];
    const box = document.getElementById("mobileBoard");
    box.innerHTML = `<div class="mobile-drop" data-stage="${key}" style="min-height:60px; display:flex; flex-direction:column; gap:8px">
      ${cards.length ? cards.map(leadCard).join("") : '<div class="empty">No leads in this stage</div>'}
    </div>`;
    wireDragDrop(box);
    wireCardActions(box);
  }

  function renderList(rows){
    const industryFields = template.fields;
    document.getElementById("listHead").innerHTML = `<tr>
      <th>Lead</th><th>Phone</th><th>Source</th><th>Campaign</th>
      ${industryFields.map(f => `<th>${App.escapeHtml(f.label)}</th>`).join("")}
      <th>Stage</th><th>Owner</th><th>Next follow-up</th><th>Created</th>
    </tr>`;
    const owners_ = ownerById();
    const sorted = [...rows].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    document.getElementById("listBody").innerHTML = sorted.length ? sorted.map(r => `
      <tr>
        <td><div class="lead-identity"><div class="lead-name">${App.escapeHtml(r.fullName || "Unnamed lead")}</div>${r.email ? `<div class="lead-meta-id">${App.escapeHtml(r.email)}</div>` : ""}</div></td>
        <td>${App.escapeHtml(r.phoneNumber || "—")}</td>
        <td>${App.escapeHtml(sourceLabel(r.source))}</td>
        <td>${App.escapeHtml(r.campaignName || "—")}</td>
        ${industryFields.map(f => `<td>${fmtFieldValue(f, r.customFields && r.customFields[f.key])}</td>`).join("")}
        <td><span class="pill ${resolvedStage(r) === "won" ? "processed" : resolvedStage(r) === "lost" ? "failed" : "pending"}">${App.escapeHtml(stageLabel(resolvedStage(r)))}</span></td>
        <td>${owners_[r.ownerId] ? App.escapeHtml(owners_[r.ownerId]) : "—"}</td>
        <td>${r.nextFollowUpAt ? fmtDate(r.nextFollowUpAt) : "—"}</td>
        <td>${fmtDateTime(r.createdAt)}</td>
      </tr>
    `).join("") : `<tr><td colspan="${8 + industryFields.length}" class="empty">No leads match your search.</td></tr>`;
  }

  function renderView(){
    const rows = applyFilters(allRows);
    document.querySelectorAll("#viewToggle button").forEach(b => b.classList.toggle("active", b.dataset.view === viewMode));
    document.getElementById("board").style.display = viewMode === "board" ? "grid" : "none";
    document.querySelector(".mobile-stage-select").style.display = viewMode === "board" ? "" : "none";
    document.getElementById("listWrap").style.display = viewMode === "list" ? "block" : "none";
    if (viewMode === "board") renderBoard(rows); else renderList(rows);
  }

  document.getElementById("viewToggle").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-view]");
    if (!btn) return;
    viewMode = btn.dataset.view;
    localStorage.setItem("setu_pipeline_view", viewMode);
    renderView();
  });
  document.getElementById("mobileStage").addEventListener("change", () => renderView());
  document.getElementById("searchInput").addEventListener("input", () => renderView());

  // -------------------------------------------------------------------
  // Add Customer / Not Interested → Add to CRM - one dynamic form driven
  // entirely by template.fields, shared between both flows. "create" posts
  // a brand-new manual customer; "convert" patches an existing lead's CRM
  // fields without ever touching its source/campaign attribution.
  // -------------------------------------------------------------------

  function fieldInputHtml(field, value){
    const val = value !== undefined && value !== null ? value : "";
    if (field.type === "select") {
      return `<select data-field="${field.key}">
        <option value="">Select…</option>
        ${(field.options || []).map(o => `<option value="${o}" ${val === o ? "selected" : ""}>${App.escapeHtml(o)}</option>`).join("")}
      </select>`;
    }
    if (field.type === "textarea") {
      return `<textarea data-field="${field.key}" rows="3">${App.escapeHtml(String(val))}</textarea>`;
    }
    if (field.type === "currency" || field.type === "number") {
      return `<input type="number" data-field="${field.key}" value="${App.escapeHtml(String(val))}" step="any" />`;
    }
    return `<input type="text" data-field="${field.key}" value="${App.escapeHtml(String(val))}" />`;
  }

  function customerModalHtmlLegacy(mode, lead){
    const isConvert = mode === "convert";
    const sourceOptions = isConvert
      ? `<option value="${lead.source}" selected>${App.escapeHtml(sourceLabel(lead.source))}</option>`
      : MANUAL_SOURCES.map(s => `<option value="${s.key}">${App.escapeHtml(s.label)}</option>`).join("");
    const stageOptions = stages.map(s => {
      const selected = isConvert ? lead.pipelineStage === s.key : s.isInitial;
      return `<option value="${s.key}" ${selected ? "selected" : ""}>${App.escapeHtml(s.label)}</option>`;
    }).join("");
    const ownerOptions = `<option value="">Unassigned</option>` +
      owners.map(o => `<option value="${o.id}" ${isConvert && lead.ownerId === o.id ? "selected" : ""}>${App.escapeHtml(o.fullName)}</option>`).join("");

    return `
      <div class="modal-overlay" id="customerModalOverlay">
        <div class="modal">
          <div class="modal-header">
            <div>
              <h2>${isConvert ? "Add to CRM" : "Add Customer"}</h2>
              <p>${isConvert ? "Original source is kept as " + App.escapeHtml(sourceLabel(lead.source)) + " — just fill in what's missing." : "Create a customer and place them in the pipeline."}</p>
            </div>
            <button class="modal-close" type="button" id="customerModalClose" aria-label="Close">✕</button>
          </div>
          <div class="modal-body">
            <div id="customerModalError"></div>
            <div class="modal-field-grid">
              <div><label for="cf_name">Customer name *</label><input id="cf_name" required value="${App.escapeHtml(lead?.fullName || "")}" /></div>
              <div><label for="cf_phone">Phone *</label><input id="cf_phone" required value="${App.escapeHtml(lead?.phoneNumber || "")}" /></div>
            </div>
            <label for="cf_email">Email</label>
            <input id="cf_email" type="email" value="${App.escapeHtml(lead?.email || "")}" />

            ${template.fields.map(f => `<label>${App.escapeHtml(f.label)}</label>${fieldInputHtml(f, lead?.customFields?.[f.key])}`).join("")}

            <div class="modal-field-grid">
              <div><label for="cf_source">Source</label><select id="cf_source" ${isConvert ? "disabled" : ""}>${sourceOptions}</select></div>
              <div><label for="cf_owner">Owner</label><select id="cf_owner">${ownerOptions}</select></div>
            </div>
            <div class="modal-field-grid">
              <div><label for="cf_stage">Pipeline stage</label><select id="cf_stage">${stageOptions}</select></div>
              <div><label for="cf_followup">Next follow-up</label><input id="cf_followup" type="date" value="${lead?.nextFollowUpAt ? lead.nextFollowUpAt.slice(0, 10) : ""}" /></div>
            </div>
            <label for="cf_notes">Requirement / Notes</label>
            <textarea id="cf_notes" rows="3">${App.escapeHtml(lead?.notes || "")}</textarea>
            ${isConvert && lead.campaignName ? `<p class="hint">Campaign: ${App.escapeHtml(lead.campaignName)}</p>` : ""}
          </div>
          <div class="modal-footer">
            <button class="btn secondary" type="button" id="customerModalCancel">Cancel</button>
            <button class="btn" type="button" id="customerModalSave">${isConvert ? "Save Customer" : "Add Customer"}</button>
          </div>
        </div>
      </div>`;
  }

  // ---- Form-driven variant - used whenever the company has a configured
  // default internal form (see /api/forms/default-internal, fetched once at
  // startup below). Renders EVERY field (system + custom) from that form via
  // the shared FormRenderer, instead of the fixed cf_* inputs above.
  function valuesFromLead(fields, lead){
    if (!lead) return {};
    const values = {};
    fields.forEach(f => {
      if (f.mappingType === "system") {
        switch (f.systemField) {
          case "fullName": values[f.key] = lead.fullName || ""; break;
          case "phoneNumber": values[f.key] = lead.phoneNumber || ""; break;
          case "email": values[f.key] = lead.email || ""; break;
          case "source": values[f.key] = lead.source || ""; break;
          case "ownerId": values[f.key] = lead.ownerId || ""; break;
          case "pipelineStage": values[f.key] = lead.pipelineStage || ""; break;
          case "nextFollowUpAt": values[f.key] = lead.nextFollowUpAt ? lead.nextFollowUpAt.slice(0, 10) : ""; break;
          case "notes": values[f.key] = lead.notes || ""; break;
          default: break;
        }
      } else {
        values[f.key] = lead.customFields ? lead.customFields[f.key] : undefined;
      }
    });
    return values;
  }

  function customerModalHtmlFromForm(mode, lead){
    const isConvert = mode === "convert";
    const dynOpts = {
      dynamicOptions: {
        source: sources.map(s => ({ value: s.key, label: s.label })),
        ownerId: owners.map(o => ({ value: o.id, label: o.fullName })),
        pipelineStage: stages.map(s => ({ value: s.key, label: s.label })),
        crmCampaignId: campaignsList.map(c => ({ value: c.id, label: c.name })),
      },
    };
    if (isConvert) {
      const sourceField = internalFormFields.find(f => f.systemField === "source");
      if (sourceField) dynOpts.disabledFields = [sourceField.key];
    }
    const bodyHtml = FormRenderer.renderFields(internalFormFields, valuesFromLead(internalFormFields, lead), dynOpts);

    return `
      <div class="modal-overlay" id="customerModalOverlay">
        <div class="modal">
          <div class="modal-header">
            <div>
              <h2>${isConvert ? "Add to CRM" : "Add Customer"}</h2>
              <p>${isConvert ? "Original source is kept as " + App.escapeHtml(sourceLabel(lead.source)) + " — just fill in what's missing." : "Create a customer and place them in the pipeline."}</p>
            </div>
            <button class="modal-close" type="button" id="customerModalClose" aria-label="Close">✕</button>
          </div>
          <div class="modal-body">
            <div id="customerModalError"></div>
            <form id="customerModalForm">${bodyHtml}</form>
            ${isConvert && lead.campaignName ? `<p class="hint">Campaign: ${App.escapeHtml(lead.campaignName)}</p>` : ""}
          </div>
          <div class="modal-footer">
            <button class="btn secondary" type="button" id="customerModalCancel">Cancel</button>
            <button class="btn" type="button" id="customerModalSave">${isConvert ? "Save Customer" : "Add Customer"}</button>
          </div>
        </div>
      </div>`;
  }

  async function submitCustomerModalFromForm(mode, leadId){
    const errBox = document.getElementById("customerModalError");
    errBox.innerHTML = "";
    const formEl = document.getElementById("customerModalForm");
    const values = FormRenderer.collectValues(formEl, internalFormFields);
    const errors = FormRenderer.validate(internalFormFields, values);
    if (Object.keys(errors).length > 0) {
      FormRenderer.showErrors(formEl, errors);
      return;
    }
    FormRenderer.clearErrors(formEl);

    const saveBtn = document.getElementById("customerModalSave");
    saveBtn.disabled = true;
    try {
      const body = { values };
      if (mode === "convert") body.leadId = leadId;
      await App.apiJson(`/api/forms/${internalForm.id}/submit`, { method: "POST", body });
      closeModal();
      load();
    } catch (err) {
      if (err.fieldErrors) FormRenderer.showErrors(formEl, err.fieldErrors);
      errBox.innerHTML = `<div class="banner error">${App.escapeHtml(err.message)}</div>`;
      saveBtn.disabled = false;
    }
  }

  // ---- Dispatchers -----------------------------------------------------

  function customerModalHtml(mode, lead){
    return (internalForm && internalFormFields.length > 0)
      ? customerModalHtmlFromForm(mode, lead)
      : customerModalHtmlLegacy(mode, lead);
  }

  function submitCustomerModal(mode, leadId){
    return (internalForm && internalFormFields.length > 0)
      ? submitCustomerModalFromForm(mode, leadId)
      : submitCustomerModalLegacy(mode, leadId);
  }

  function closeModal(){
    document.getElementById("modalRoot").innerHTML = "";
  }

  function openCustomerModal({ mode, lead }){
    const usingForm = internalForm && internalFormFields.length > 0;
    document.getElementById("modalRoot").innerHTML = customerModalHtml(mode, lead || null);
    document.getElementById("customerModalClose").addEventListener("click", closeModal);
    document.getElementById("customerModalCancel").addEventListener("click", closeModal);
    document.getElementById("customerModalOverlay").addEventListener("click", (e) => {
      if (e.target.id === "customerModalOverlay") closeModal();
    });
    document.getElementById("customerModalSave").addEventListener("click", () => submitCustomerModal(mode, lead?.id));
    if (usingForm) {
      FormRenderer.wireConditionals(document.getElementById("customerModalForm"), internalFormFields);
      document.querySelector("#customerModalForm input, #customerModalForm select, #customerModalForm textarea")?.focus();
    } else {
      document.getElementById("cf_name").focus();
    }
  }

  async function submitCustomerModalLegacy(mode, leadId){
    const errBox = document.getElementById("customerModalError");
    errBox.innerHTML = "";
    const fullName = document.getElementById("cf_name").value.trim();
    const phoneNumber = document.getElementById("cf_phone").value.trim();
    if (!fullName || !phoneNumber) {
      errBox.innerHTML = `<div class="banner error">Customer name and phone are required.</div>`;
      return;
    }
    const customFields = {};
    document.querySelectorAll("#modalRoot [data-field]").forEach(el => {
      if (el.value !== "") customFields[el.dataset.field] = el.value;
    });
    const body = {
      fullName,
      phoneNumber,
      email: document.getElementById("cf_email").value.trim(),
      ownerId: document.getElementById("cf_owner").value || null,
      pipelineStage: document.getElementById("cf_stage").value,
      nextFollowUpAt: document.getElementById("cf_followup").value || null,
      notes: document.getElementById("cf_notes").value.trim(),
      customFields,
    };

    const saveBtn = document.getElementById("customerModalSave");
    saveBtn.disabled = true;
    try {
      if (mode === "create") {
        body.source = document.getElementById("cf_source").value;
        await App.apiJson("/api/leads", { method: "POST", body });
      } else {
        await App.apiJson(`/api/leads/${leadId}`, { method: "PATCH", body });
      }
      closeModal();
      load();
    } catch (err) {
      errBox.innerHTML = `<div class="banner error">${App.escapeHtml(err.message)}</div>`;
      saveBtn.disabled = false;
    }
  }

  function openNotInterestedModal(lead){
    document.getElementById("modalRoot").innerHTML = `
      <div class="modal-overlay" id="niModalOverlay">
        <div class="modal modal-sm">
          <div class="modal-header">
            <div>
              <h2>Not interested?</h2>
              <p>${App.escapeHtml(lead.fullName || "This lead")} isn't interested via digital marketing. What would you like to do?</p>
            </div>
            <button class="modal-close" type="button" id="niModalClose" aria-label="Close">✕</button>
          </div>
          <div class="modal-body">
            <button type="button" class="choice-tile" id="niCloseLead">
              <span class="choice-tile-title">Close lead</span>
              <span class="choice-tile-desc">Mark as lost — no further action needed.</span>
            </button>
            <button type="button" class="choice-tile" id="niAddToCrm">
              <span class="choice-tile-title">Add to CRM</span>
              <span class="choice-tile-desc">Keep working this person as a customer and fill in more details.</span>
            </button>
          </div>
        </div>
      </div>`;
    document.getElementById("niModalClose").addEventListener("click", closeModal);
    document.getElementById("niModalOverlay").addEventListener("click", (e) => {
      if (e.target.id === "niModalOverlay") closeModal();
    });
    document.getElementById("niCloseLead").addEventListener("click", async () => {
      const lostStage = stages.find(s => s.isClosed && !s.isWon)?.key || "lost";
      try {
        await App.apiJson(`/api/leads/${lead.id}/stage`, { method: "PATCH", body: { stage: lostStage } });
        closeModal();
        load();
      } catch (err) {
        closeModal();
        document.getElementById("banner").innerHTML = `<div class="banner error">${App.escapeHtml(err.message)}</div>`;
      }
    });
    document.getElementById("niAddToCrm").addEventListener("click", () => {
      openCustomerModal({ mode: "convert", lead });
    });
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.getElementById("modalRoot").innerHTML.trim()) closeModal();
  });
  document.getElementById("addCustomerBtn").addEventListener("click", () => openCustomerModal({ mode: "create" }));

  async function loadCampaignOptions(){
    const select = document.getElementById("campaignSelect");
    try {
      const { campaigns } = await App.apiJson("/api/campaigns");
      campaignsList = campaigns;
      select.innerHTML = `<option value="">All campaigns</option>` + campaigns.map(c => `<option value="${c.id}">${App.escapeHtml(c.name)}</option>`).join("");
    } catch {
      select.innerHTML = `<option value="">All campaigns</option>`;
    }
  }

  /** Loads the company's configured internal form (Add Customer / Not
   * Interested -> Add to CRM), if any - see /api/forms/default-internal.
   * Any failure (network error, no form provisioned yet) is swallowed;
   * internalForm stays null and customerModalHtml/submitCustomerModal fall
   * back to their original hard-coded fields, exactly as before this
   * feature existed. */
  async function loadInternalForm(){
    try {
      const result = await App.apiJson("/api/forms/default-internal");
      if (result.form && Array.isArray(result.fields) && result.fields.length > 0) {
        internalForm = result.form;
        internalFormFields = result.fields;
      }
    } catch { /* fall back to legacy fields */ }
  }

  async function load(){
    const banner = document.getElementById("banner");
    banner.innerHTML = "";
    const campaignId = document.getElementById("campaignSelect").value;
    let data;
    try {
      data = await App.apiJson(`/api/pipeline${campaignId ? `?campaignId=${campaignId}` : ""}`);
    } catch (err) {
      document.getElementById("pipelineContent").style.display = "none";
      document.getElementById("emptyPipeline").style.display = "none";
      banner.innerHTML = `<div class="banner error">${App.escapeHtml(err.message)}</div>`;
      return;
    }

    template = data.template;
    stages = data.template.stages;
    sources = data.sources;
    owners = data.owners;
    allRows = Object.values(data.board).flat();

    // A stale/invalid ?stage= (e.g. leftover after an industry template
    // change) should never silently hide the whole pipeline - drop it.
    if (stageFilter && !stages.some(s => s.key === stageFilter)) stageFilter = null;
    renderStageFilterChip();

    const totalCount = allRows.length;
    if (totalCount === 0 && !campaignId) {
      document.getElementById("pipelineContent").style.display = "none";
      document.getElementById("emptyPipeline").style.display = "block";
      document.getElementById("emptyPipeline").innerHTML = `
        <div class="card state-block">
          <p class="state-title">Your pipeline is ready</p>
          <p class="state-desc">New leads from your campaigns will appear here automatically. You can also add a customer manually.</p>
          <div class="state-actions">
            ${canManageLeads ? '<button class="btn" type="button" id="emptyAddCustomerBtn">+ Add Customer</button>' : ""}
            <a href="/campaigns.html" class="btn secondary" style="display:inline-flex">View campaigns</a>
          </div>
        </div>`;
      document.getElementById("emptyAddCustomerBtn")?.addEventListener("click", () => openCustomerModal({ mode: "create" }));
      return;
    }

    document.getElementById("emptyPipeline").style.display = "none";
    document.getElementById("pipelineContent").style.display = "block";
    renderView();
  }

  (async () => {
    me = await App.requireAuth();
    if (!me) return;
    App.renderNav(me, "/pipeline.html");
    canManage = App.hasPermission(me, "pipeline.manage");
    canManageLeads = App.hasPermission(me, "leads.manage");
    if (canManageLeads) {
      document.getElementById("addCustomerBtn").style.display = "inline-flex";
      await loadInternalForm();
    }

    await loadCampaignOptions();
    document.getElementById("campaignSelect").addEventListener("change", load);
    await load();
  })();
</script>
</body>
</html>
