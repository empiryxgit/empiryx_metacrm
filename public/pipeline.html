<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pipeline — Setu CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <nav class="topnav" id="topnav"></nav>
  <div class="wrap" style="max-width:1240px">
    <div class="page-head">
      <div class="page-head-text">
        <h1 class="page-title">Pipeline</h1>
        <p class="page-sub">Drag a lead card to move it between stages.</p>
      </div>
    </div>

    <div class="board-toolbar">
      <div class="field-inline">
        <label for="campaignSelect">Campaign</label>
        <select id="campaignSelect"></select>
      </div>
    </div>

    <div id="banner"></div>
    <div class="board" id="board"></div>
  </div>

<script src="/assets/app.js"></script>
<script>
  let me, canManage;
  const STAGE_LABELS = { new: "New", contacted: "Contacted", qualified: "Qualified", site_visit: "Site Visit", won: "Won", lost: "Lost" };

  async function loadCampaigns() {
    const select = document.getElementById("campaignSelect");
    let campaigns;
    try {
      ({ campaigns } = await App.apiJson("/api/campaigns"));
    } catch (err) {
      select.innerHTML = "<option>Unable to load campaigns</option>";
      document.getElementById("banner").innerHTML = `<div class="banner error">We couldn't load your campaigns. Refresh to try again.</div>`;
      return null;
    }
    if (!campaigns.length) {
      select.innerHTML = "<option>No campaigns yet</option>";
      document.getElementById("board").innerHTML = `
        <div class="card state-block" style="grid-column:1/-1">
          <p class="state-title">No campaigns yet</p>
          <p class="state-desc">Create a campaign to start building a pipeline of leads.</p>
          <div class="state-actions"><a href="/campaigns.html" class="btn secondary" style="display:inline-flex">Go to campaigns</a></div>
        </div>`;
      return null;
    }
    select.innerHTML = campaigns.map(c => `<option value="${c.id}">${App.escapeHtml(c.name)}</option>`).join("");
    return campaigns[0].id;
  }

  function leadCard(lead) {
    const name = lead.fullName || lead.metaLeadId;
    const contact = lead.email || lead.phoneNumber || "";
    return `<div class="lead-card" draggable="${canManage}" data-lead-id="${lead.id}">
      <div class="name">${App.escapeHtml(name)}</div>
      ${contact ? `<div class="meta">${App.escapeHtml(contact)}</div>` : ""}
      ${lead.campaignName ? `<span class="source">${App.escapeHtml(lead.campaignName)}</span>` : ""}
    </div>`;
  }

  function renderBoard(data) {
    const board = document.getElementById("board");
    board.innerHTML = data.stages.map(stage => `
      <div class="col" data-stage="${stage}">
        <div class="col-head"><span>${STAGE_LABELS[stage]}</span><span>${data.board[stage].length}</span></div>
        <div class="col-body" data-stage="${stage}">${data.board[stage].length ? data.board[stage].map(leadCard).join("") : '<div class="empty" style="padding:18px 8px">No leads</div>'}</div>
      </div>
    `).join("");

    if (!canManage) return;

    board.querySelectorAll(".lead-card").forEach(card => {
      card.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", card.dataset.leadId);
      });
    });
    board.querySelectorAll(".col-body").forEach(col => {
      col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("dragover"); });
      col.addEventListener("dragleave", () => col.classList.remove("dragover"));
      col.addEventListener("drop", async (e) => {
        e.preventDefault();
        col.classList.remove("dragover");
        const leadId = e.dataTransfer.getData("text/plain");
        const stage = col.dataset.stage;
        try {
          await App.apiJson(`/api/leads/${leadId}/stage`, { method: "PATCH", body: { stage } });
          load();
        } catch (err) {
          document.getElementById("banner").innerHTML = `<div class="banner error">${App.escapeHtml(err.message)}</div>`;
        }
      });
    });
  }

  async function load() {
    const campaignId = document.getElementById("campaignSelect").value;
    if (!campaignId) return;
    try {
      const data = await App.apiJson(`/api/pipeline?campaignId=${campaignId}`);
      renderBoard(data);
    } catch (err) {
      document.getElementById("banner").innerHTML = `<div class="banner error">${App.escapeHtml(err.message)}</div>`;
    }
  }

  (async () => {
    me = await App.requireAuth();
    if (!me) return;
    App.renderNav(me, "/pipeline.html");
    canManage = App.hasPermission(me, "pipeline.manage");

    const firstCampaignId = await loadCampaigns();
    if (!firstCampaignId) return;
    document.getElementById("campaignSelect").addEventListener("change", load);
    load();
  })();
</script>
</body>
</html>
