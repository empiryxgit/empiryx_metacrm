<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Set a new password — RUTA Lead Management System</title>
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Set a new password</h1>
      <p class="sub">You're using a temporary password — choose a permanent one to continue.</p>
      <div id="banner"></div>
      <form id="form">
        <label for="currentPassword">Temporary password</label>
        <input id="currentPassword" type="password" required autocomplete="current-password" />

        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" required minlength="10" autocomplete="new-password" />
        <div class="hint">At least 10 characters.</div>

        <button class="btn full" type="submit" id="submitBtn">Set password</button>
      </form>
    </div>
  </div>

<script src="/assets/app.js"></script>
<script>
  const form = document.getElementById("form");
  const banner = document.getElementById("banner");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    banner.innerHTML = "";
    submitBtn.disabled = true;
    try {
      await App.apiJson("/api/auth/change-password", {
        method: "POST",
        body: {
          currentPassword: document.getElementById("currentPassword").value,
          newPassword: document.getElementById("newPassword").value,
        },
      });
      banner.innerHTML = `<div class="banner success">Password updated. Redirecting…</div>`;
      setTimeout(() => (window.location.href = "/login.html"), 900);
    } catch (err) {
      banner.innerHTML = `<div class="banner error">${App.escapeHtml(err.message)}</div>`;
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
